# Portão de release. Falhou, não entrega: o GitHub marca o commit com ✗.
name: Portão de release

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # fuzz pesado, todo dia às 3h de Brasília
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Unidade, fuzz, golden, integração e contrato visual
        run: npm test
        env:
          CI: 'true'
          FUZZ_GAMES: ${{ github.event_name == 'schedule' && '3000' || '250' }}
