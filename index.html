<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100b">
<link rel="icon" type="image/svg+xml" href="">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-512.png">
<title>Estante · Magic: The Gathering</title>
<style>/* =====================================================================
   F4 · TOKENS
   Única fonte de cor, espaço, raio, elevação, tipografia e movimento.
   Nenhuma regra de componente pode escrever valor literal.

   Referências: Arena (mesa escura, carta como única cor viva),
   Scryfall (tipografia de dado, densidade sem ruído),
   Moxfield (densidade de lista).
   ===================================================================== */
:root {
  /* ---- espaço: escala de 4px ---- */
  --space-0: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* ---- raio ---- */
  --radius-1: 4px;
  --radius-2: 8px;
  --radius-3: 14px;
  --radius-full: 999px;
  --radius-card: 4.75%;

  /* ---- tipografia ---- */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 11px;   --lh-xs: 1.45;
  --text-sm: 12.5px; --lh-sm: 1.45;
  --text-md: 14px;   --lh-md: 1.5;
  --text-lg: 16px;   --lh-lg: 1.45;
  --text-xl: 20px;   --lh-xl: 1.3;
  --text-2xl: 27px;  --lh-2xl: 1.2;
  --text-3xl: 36px;  --lh-3xl: 1.1;
  --weight-regular: 400;
  --weight-medium: 600;
  --weight-bold: 700;

  /* ---- movimento ---- */
  --dur-1: 110ms;
  --dur-2: 180ms;
  --dur-3: 280ms;
  --ease-out: cubic-bezier(.22, .61, .36, 1);
  --ease-in-out: cubic-bezier(.45, .05, .55, .95);

  /* ---- camadas ---- */
  --z-base: 0;
  --z-sticky: 20;
  --z-overlay: 40;
  --z-modal: 60;
  --z-toast: 80;

  /* ---- alvo de toque ---- */
  --tap-min: 44px;

  /* ---- cor das manas: constante entre temas, é identidade de Magic ---- */
  --mana-w: #f5e6c8;
  --mana-u: #4a7fb5;
  --mana-b: #4b4453;
  --mana-r: #c05a3e;
  --mana-g: #3f8558;
  --mana-c: #8a8f99;

  /* ---- tema escuro: nogueira e papel envelhecido ----
     Madeira é o móvel; a carta é o conteúdo. Nenhum tom de madeira
     aparece em texto ou em estado — só em fundo, superfície e borda. */
  --bg: #14100b;
  --bg-elev-1: #1f1811;
  --bg-elev-2: #2a2118;
  --bg-elev-3: #372c20;
  --border: #443626;
  --border-strong: #5e4b34;
  --fg: #f1e8d7;
  --fg-muted: #bcab90;
  --fg-subtle: #9c8b71;
  --accent: #cfa851;
  --accent-hover: #e8c375;
  --accent-fg: #18120a;
  --accent-soft: rgba(207, 168, 81, .16);
  --positive: #6fae8d;
  --positive-fg: #0c1a13;
  --negative: #d4785f;
  --negative-fg: #1c0e09;
  --warning: #d9a33f;
  --overlay: rgba(10, 7, 4, .82);
  --scrim: rgba(20, 16, 11, .95);
  --grain-1: rgba(255, 244, 222, .022);
  --grain-2: rgba(0, 0, 0, .18);
  --shelf-edge: #4a3a27;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .42);
  --shadow-2: 0 4px 12px rgba(0, 0, 0, .48);
  --shadow-3: 0 12px 34px rgba(0, 0, 0, .6);
  --focus-ring: 0 0 0 3px var(--accent-soft);
  color-scheme: dark;
}

/* ---- tema claro: papel e tinta, não inversão ---- */
:root[data-theme="light"] {
  --bg: #e7dbc4;
  --bg-elev-1: #f6eeda;
  --bg-elev-2: #e0d3b6;
  --bg-elev-3: #d1c09c;
  --border: #bda98a;
  --border-strong: #9a8560;
  --fg: #241b0f;
  --fg-muted: #57492f;
  --fg-subtle: #6b5b3c;
  --accent: #7a5a17;
  --accent-hover: #674b12;
  --accent-fg: #fdf8ea;
  --accent-soft: rgba(122, 90, 23, .15);
  --positive: #2a6349;
  --positive-fg: #f1f8f4;
  --negative: #92381f;
  --negative-fg: #fdf2ee;
  --warning: #8a6410;
  --overlay: rgba(46, 35, 18, .5);
  --scrim: rgba(246, 238, 218, .95);
  --grain-1: rgba(90, 62, 22, .035);
  --grain-2: rgba(120, 88, 40, .05);
  --shelf-edge: #b59a6c;
  --shadow-1: 0 1px 2px rgba(74, 56, 26, .14);
  --shadow-2: 0 4px 12px rgba(74, 56, 26, .18);
  --shadow-3: 0 12px 34px rgba(74, 56, 26, .24);
  color-scheme: light;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    --bg: #e7dbc4;
    --bg-elev-1: #f6eeda;
    --bg-elev-2: #e0d3b6;
    --bg-elev-3: #d1c09c;
    --border: #bda98a;
    --border-strong: #9a8560;
    --fg: #241b0f;
    --fg-muted: #57492f;
    --fg-subtle: #6b5b3c;
    --accent: #7a5a17;
    --accent-hover: #674b12;
    --accent-fg: #fdf8ea;
    --accent-soft: rgba(122, 90, 23, .15);
    --positive: #2a6349;
    --positive-fg: #f1f8f4;
    --negative: #92381f;
    --negative-fg: #fdf2ee;
    --warning: #8a6410;
    --overlay: rgba(46, 35, 18, .5);
    --scrim: rgba(246, 238, 218, .95);
    --grain-1: rgba(90, 62, 22, .035);
    --grain-2: rgba(120, 88, 40, .05);
    --shelf-edge: #b59a6c;
    --shadow-1: 0 1px 2px rgba(74, 56, 26, .14);
    --shadow-2: 0 4px 12px rgba(74, 56, 26, .18);
    --shadow-3: 0 12px 34px rgba(74, 56, 26, .24);
    color-scheme: light;
  }
}

/* =====================================================================
   F5 · BASE + COMPONENTES
   Toda propriedade visual sai de token. Nenhum literal de cor aqui.
   ===================================================================== */

/* ---------------- reset e base ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: var(--lh-md);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------------- primitivas ---------------- */
.ds-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.ds-row { display: flex; align-items: center; gap: var(--space-2); }
.ds-row--wrap { flex-wrap: wrap; }
.ds-grow { flex: 1; min-width: 0; }
.ds-center { display: grid; place-items: center; }
.ds-wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 var(--space-4); }

.ds-surface { background: var(--bg-elev-1); border-radius: var(--radius-2); box-shadow: var(--shadow-1); }
.ds-surface--flat { box-shadow: none; border: 1px solid var(--border); }
.ds-surface--raised { background: var(--bg-elev-2); box-shadow: var(--shadow-2); }
.ds-surface--pad { padding: var(--space-4); }

.ds-text { margin: 0; }
.ds-text--display { font-family: var(--font-display); font-weight: var(--weight-regular); }
.ds-text--xs { font-size: var(--text-xs); line-height: var(--lh-xs); }
.ds-text--sm { font-size: var(--text-sm); line-height: var(--lh-sm); }
.ds-text--md { font-size: var(--text-md); line-height: var(--lh-md); }
.ds-text--lg { font-size: var(--text-lg); line-height: var(--lh-lg); }
.ds-text--xl { font-size: var(--text-xl); line-height: var(--lh-xl); }
.ds-text--2xl { font-size: var(--text-2xl); line-height: var(--lh-2xl); }
.ds-text--3xl { font-size: var(--text-3xl); line-height: var(--lh-3xl); }
.ds-text--muted { color: var(--fg-muted); }
.ds-text--subtle { color: var(--fg-subtle); }
.ds-text--accent { color: var(--accent); }
.ds-text--mono { font-family: var(--font-mono); }
.ds-text--caps { text-transform: uppercase; letter-spacing: .09em; font-size: var(--text-xs); color: var(--fg-muted); }

/* ---------------- botão ---------------- */
.ds-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--tap-min); padding: 0 var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-1);
  background: var(--bg-elev-2); color: var(--fg);
  font-size: var(--text-md); font-weight: var(--weight-medium);
  transition: background-color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out),
              color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out),
              box-shadow var(--dur-1) var(--ease-out);
}
.ds-btn:hover { border-color: var(--border-strong); background: var(--bg-elev-3); }
.ds-btn:active { transform: translateY(1px); }
.ds-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.ds-btn--primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); box-shadow: var(--shadow-1); }
.ds-btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); }
.ds-btn--ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
.ds-btn--ghost:hover { background: var(--bg-elev-2); color: var(--fg); border-color: transparent; }
.ds-btn--danger { color: var(--negative); border-color: var(--border); }
.ds-btn--danger:hover { background: var(--negative); color: var(--negative-fg); border-color: var(--negative); }
.ds-btn--block { width: 100%; }
.ds-btn--icon { width: var(--tap-min); padding: 0; }

/* ---------------- campos ---------------- */
.ds-field { display: block; }
.ds-field__label { display: block; font-size: var(--text-sm); color: var(--fg-muted); margin-bottom: var(--space-1); }
.ds-field__hint { display: block; font-size: var(--text-xs); color: var(--fg-subtle); margin-top: var(--space-1); }
.ds-input, .ds-select, .ds-textarea {
  width: 100%; min-height: var(--tap-min);
  padding: var(--space-2) var(--space-3);
  background: var(--bg-elev-2); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius-1);
  transition: border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
}
.ds-textarea { min-height: 160px; resize: vertical; font-family: var(--font-mono); font-size: var(--text-sm); }
.ds-input:focus, .ds-select:focus, .ds-textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
}
.ds-field--invalid .ds-input, .ds-field--invalid .ds-select, .ds-field--invalid .ds-textarea { border-color: var(--negative); }

/* ---------------- badge, chip ---------------- */
.ds-badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px var(--space-2); border-radius: var(--radius-1);
  border: 1px solid var(--border); color: var(--fg-muted);
  font-size: var(--text-xs); line-height: var(--lh-xs); white-space: nowrap;
}
.ds-badge--positive { color: var(--positive); border-color: var(--positive); }
.ds-badge--negative { color: var(--negative); border-color: var(--negative); }
.ds-badge--accent { color: var(--accent); border-color: var(--accent); }
.ds-badge--solid { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: var(--weight-medium); }

.ds-chip {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1);
  min-height: var(--tap-min); padding: 0 var(--space-3);
  border: 1px solid var(--border); border-radius: var(--radius-full);
  background: transparent; color: var(--fg-muted); font-size: var(--text-sm);
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.ds-chip:hover { border-color: var(--border-strong); color: var(--fg); }
.ds-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: var(--weight-medium); }

/* ---------------- pip de mana ---------------- */
.ds-pip {
  display: inline-block; width: 14px; height: 14px; border-radius: var(--radius-full);
  border: 1px solid var(--border-strong); vertical-align: -2px; margin-right: 2px;
}
.ds-pip--w { background: var(--mana-w); }
.ds-pip--u { background: var(--mana-u); }
.ds-pip--b { background: var(--mana-b); }
.ds-pip--r { background: var(--mana-r); }
.ds-pip--g { background: var(--mana-g); }
.ds-pip--c { background: var(--mana-c); }

/* ---------------- tabs ---------------- */
.ds-tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); }
.ds-tab {
  min-height: var(--tap-min); padding: 0 var(--space-4);
  color: var(--fg-muted); font-size: var(--text-md);
  border-bottom: 2px solid transparent;
  transition: color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.ds-tab:hover { color: var(--fg); }
.ds-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: var(--weight-medium); }

/* ---------------- lista ---------------- */
.ds-list { border: 1px solid var(--border); border-radius: var(--radius-2); overflow: hidden; background: var(--bg-elev-1); }
.ds-list__item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; min-height: 56px; padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border); text-align: left;
  transition: background-color var(--dur-1) var(--ease-out);
}
.ds-list__item:last-child { border-bottom: none; }
.ds-list__item:hover { background: var(--accent-soft); }
.ds-list__group {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--bg-elev-3); color: var(--accent);
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .09em;
  border-bottom: 1px solid var(--border);
}

/* ---------------- sheet e dialog ---------------- */
.ds-overlay {
  position: fixed; inset: 0; z-index: var(--z-modal);
  background: var(--overlay); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: var(--space-4);
  animation: ds-fade var(--dur-2) var(--ease-out);
}
.ds-overlay[data-open="true"] { display: flex; }
.ds-dialog {
  width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
  background: var(--bg-elev-1); border-radius: var(--radius-3);
  box-shadow: var(--shadow-3); padding: var(--space-5);
  animation: ds-rise var(--dur-2) var(--ease-out);
}
.ds-dialog__title { font-family: var(--font-display); font-size: var(--text-xl); margin: 0 0 var(--space-3); }
.ds-dialog__actions { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--space-4); }
@keyframes ds-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes ds-rise { from { opacity: 0; transform: translateY(12px) scale(.985) } to { opacity: 1; transform: none } }

/* ---------------- toast ---------------- */
.ds-toast {
  position: fixed; left: 50%; bottom: var(--space-5); z-index: var(--z-toast);
  transform: translateX(-50%) translateY(10px);
  background: var(--fg); color: var(--bg);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-2);
  box-shadow: var(--shadow-3); font-size: var(--text-sm); font-weight: var(--weight-medium);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
.ds-toast[data-open="true"] { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- estados ---------------- */
.ds-empty {
  border: 1px dashed var(--border); border-radius: var(--radius-2);
  padding: var(--space-6) var(--space-4); text-align: center; color: var(--fg-muted);
}
.ds-note {
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-1); background: var(--bg-elev-1);
  padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--fg-muted);
}
.ds-note--warning { border-left-color: var(--warning); }
.ds-note--negative { border-left-color: var(--negative); }
.ds-spinner {
  width: 18px; height: 18px; border-radius: var(--radius-full);
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: ds-spin 700ms linear infinite;
}
@keyframes ds-spin { to { transform: rotate(360deg) } }

/* ---------------- carta ---------------- */
.ds-card {
  position: relative; display: block; width: 100%;
  aspect-ratio: 488 / 680; border-radius: var(--radius-card); overflow: hidden;
  background: var(--bg-elev-3); border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
  transition: transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.ds-card:hover { box-shadow: var(--shadow-2); }
.ds-card img { width: 100%; height: 100%; object-fit: cover; }
.ds-card__fallback {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: var(--space-2); text-align: center;
  font-family: var(--font-display); font-size: var(--text-sm); color: var(--fg);
}
.ds-cardgrid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
@media (min-width: 700px) { .ds-cardgrid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }

/* ---------------- barra de aplicação ---------------- */
.ds-appbar {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--scrim); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-1);
}
.ds-appbar__inner { display: flex; align-items: center; gap: var(--space-3); min-height: 56px; }
.ds-appbar__brand { font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.1; }
.ds-appbar__brand small { display: block; font-family: var(--font-ui); font-size: var(--text-xs); color: var(--fg-muted); }

.ds-hidden { display: none !important; }

/* ===================== marca ===================== */
.brand { display: inline-flex; align-items: center; gap: var(--space-2); text-decoration: none; color: var(--fg); }
.brand-mark { display: block; flex: none; }
.brand__name { display: flex; flex-direction: column; line-height: 1.05; }
.brand__word { font-family: var(--font-display); font-size: var(--text-lg); letter-spacing: .01em; }
.brand__tag { font-size: var(--text-xs); color: var(--fg-muted); letter-spacing: .06em; }

/* ===================== móvel: veio de madeira e ombro de prateleira =====================
   Textura de contraste muito baixo, só atrás de superfície, nunca sob texto. */
body {
  background-image:
    repeating-linear-gradient(94deg, var(--grain-1) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(88deg, var(--grain-2) 0 1px, transparent 1px 23px),
    radial-gradient(1200px 520px at 50% -12%, var(--bg-elev-1) 0%, transparent 62%);
  background-attachment: fixed;
}
.ds-surface { border: 1px solid var(--border); }
.ds-surface--shelf {
  background-image: repeating-linear-gradient(91deg, var(--grain-1) 0 2px, transparent 2px 9px);
  border-bottom: 3px solid var(--shelf-edge);
}
.ds-list__group { border-bottom: 2px solid var(--shelf-edge); }
.ds-list { border-bottom: 3px solid var(--shelf-edge); }
.ds-appbar { border-bottom: 2px solid var(--shelf-edge); }

/* ===================== L3 · galeria da lista ===================== */
.ds-text--positive { color: var(--positive); }
.deck-group { margin-top: var(--space-5); }
.deck-group__head { align-items: baseline; border-bottom: 2px solid var(--shelf-edge); padding-bottom: var(--space-1); }
.deck-slot { position: relative; }
.deck-slot[data-missing="true"] .ds-card img { opacity: .42; filter: grayscale(.85); }
.deck-slot__qty, .deck-slot__flag {
  position: absolute; pointer-events: none; font-size: var(--text-xs); line-height: 1;

/* ---------------- M4 · prioridade e pilha ---------------- */

/* ---------------- M5 · ações baseadas em estado ---------------- */

/* ---------------- ações ---------------- */

/** Todas as ações legais agora para o jogador p. */

  }
  if (s.pending) {
    const k = s.pending.kind;
    if (s.pending.p !== p) return out;
    if (k === 'discard') s.zones[p].hand.forEach(oid => out.push({ t: 'discard', p, oid }));
    if (k === 'attackers') {

/** A6 · prévia do dano de combate para uma proposta de bloqueio (sem mudar nada). */

/* ---------------- M8 · registro, replay e desfazer ---------------- */

    get log() { return log.slice(); },

          Button('Descartar', { variant: 'danger', onClick: async () => { await store.remove(T.SAVE_KEY); toast('Partida descartada'); go('/'); go('/mesa'); } })))) : null,
      Surface({ class: 'ds-surface--pad ds-surface--shelf' }, Stack({},
        Field('Sua lista', Select(opts, { id: 'mesa-mine', value: state.mine, onChange: e => { state.mine = e.target.value; } })),
        Field('Oponente', oppChips),
        theirsField,
        Field('Modo', Row({ class: 'ds-row--wrap' }, Chip('Mesa assistida', { pressed: true }),
          h('span', { class: 'ds-text ds-text--sm ds-text--muted' }, 'Motor completo libera quando a lista tiver cobertura total de scripts.'))),
        Field('Mana', (() => { const c = Chip('Cobrar mana', { pressed: true, dataset: { mana: '1' } });
          c.addEventListener('click', () => { state.mana = !state.mana; c.setAttribute('aria-pressed', String(state.mana)); }); return c; })(),
          { hint: 'Ligado, conjurar toca seus terrenos sozinho e só oferece o que dá para pagar. Cartas que o motor não entende podem ser conjuradas sem pagar.' }),
        Field('Paradas', (() => { const c = Chip('Parar em todos os passos', { pressed: false, dataset: { stopall: '1' } });
          c.addEventListener('click', () => { state.stopAll = !state.stopAll; c.setAttribute('aria-pressed', String(state.stopAll)); }); return c; })(),
          { hint: 'Desligado, a mesa passa sozinha onde não há decisão, como no Arena.' }),
        Field('Semente', Input({ id: 'mesa-seed', value: String(state.seed), inputmode: 'numeric', onInput: e => { state.seed = parseInt(e.target.value, 10) || 0; } }),
          { hint: 'A mesma semente com as mesmas jogadas reproduz a partida.' }),
        Row({}, startBtn))));
  })();
  return root;
}

/* ---------------- A1–A9 · a mesa ---------------- */
function createTableScreen({ store }) {
  const root = h('div', { class: 'tb', id: 'tb' }, Row({ class: 'ds-wrap' }, Spinner()));
  let table = null, adjudicating = null, bottomPick = new Set(), shownViewer = null, handoff = false;

  const save = () => store.set(T.SAVE_KEY, table.serialize()).catch(() => {});
  const card = name => (table.setup.cards || {})[name] || null;
  const imgOf = (name, size = 'small') => { const c = card(name); if (!c) return null; const im = c.images || (c.faces && c.faces[0] && c.faces[0].images); return im ? (im[size] || im.normal) : null; };
  const oracleOf = name => { const c = card(name); return c ? (c.oracle_text || '') : ''; };

  function act(action) {
    try {
      const events = table.act(action);
      const res = events.filter(e => e.kind === 'resolved' && e.adjudicate).pop();
      if (res) adjudicating = { name: res.name, oid: res.oid };
      save(); paint();
      return true;
    } catch (e) { toast(e.message || String(e)); return false; }
  }

  (async () => {
    const data = await store.get(T.SAVE_KEY);
    if (!data) return mount(root, Stack(pad(), Text('Mesa', { size: '2xl', display: true, as: 'h1' }),
      Empty('Nenhuma partida em andamento.', Button('Preparar partida', { variant: 'primary', onClick: () => go('/mesa') }))));
    try { table = T.restoreTable(data); }
    catch (e) {
      return mount(root, Stack(pad(), Note(e.message === 'versao-do-motor'
        ? '<b>Esta partida foi salva por outra versão do motor.</b> Ela não pode ser retomada com segurança. Comece uma nova.'
        : '<b>A partida salva está corrompida.</b> Comece uma nova.', 'warning'),
        Button('Preparar partida', { variant: 'primary', onClick: async () => { await store.remove(T.SAVE_KEY); go('/mesa'); } })));
    }
    shownViewer = table.viewer();
    paint();
  })();

  /* ---- M7 · mana na tela ---- */
  const costLabel = (c, extra = 0) => {
    const parts = []; const g = (c.generic || 0) + extra; if (g) parts.push(`{${g}}`);
    for (let i = 0; i < (c.x || 0); i++) parts.push('{X}');
    for (const [k, n] of Object.entries(c.colored || {})) for (let i = 0; i < n; i++) parts.push(`{${k}}`);
    for (const hy of c.hybrid || []) parts.push(`{${hy.join('/')}}`);
    return parts.join('');
  };
  const poolView = pl => {
    const syms = E.COLORS.flatMap(c => Array(pl.pool[c]).fill(c));
    return syms.length ? h('span', { class: 'tb-pool', 'aria-label': 'reserva de mana' }, 'reserva ', ...syms.map(c => h('span', { class: `ds-pip ds-pip--${c.toLowerCase()}` }))) : null;
  };

  /* ---- A6 · declaração de ataque e bloqueio ---- */
  const plan = { attack: new Set(), blocks: new Map(), eligible: new Set() };
  function resetPlan() { plan.attack = new Set(); plan.blocks = new Map(); plan.eligible = new Set(); }
  function syncPlan(s, v) {
    const k = s.pending && s.pending.p === v ? s.pending.kind : null;
    if (k === 'attackers') plan.eligible = new Set(E.eligibleAttackers(s, v));
    else if (k === 'blockers') plan.eligible = new Set(E.eligibleBlockers(s, v));
    else resetPlan();
  }
  /** Durante a declaração, tocar numa criatura escolhe em vez de abrir a folha. */
  function onBoardTap(oid) {
    const s = table.state, v = table.viewer();
    if (!plan.eligible.has(oid)) return false;
    if (s.pending.kind === 'attackers') { plan.attack.has(oid) ? plan.attack.delete(oid) : plan.attack.add(oid); paint(); return true; }
    const attackers = s.combat.attackers.filter(a => s.objects[a].zone === 'battlefield' && E.canBlock(s, oid, a));
    Dialog({ title: `Bloquear com ${s.objects[oid].name}`, body: attackers.length ? h('div', { class: 'tb-sheet__actions' },
      ...attackers.map(a => Button(`Bloquear ${s.objects[a].name}`, { block: true, onClick: () => { plan.blocks.set(oid, a); closeDialog(); paint(); } })),
      plan.blocks.has(oid) ? Button('Não bloquear', { block: true, variant: 'ghost', onClick: () => { plan.blocks.delete(oid); closeDialog(); paint(); } }) : null)
      : Text('Não pode bloquear nenhum atacante (voar).', { tone: 'muted' }), actions: [Button('Fechar', { onClick: closeDialog })] });
    return true;
  }

  /* ---- folhas de ação ---- */
  function sheet(name, buttons, extra) {
    const img = imgOf(name, 'normal');
    Dialog({ title: name, body: Stack({},
      img ? h('img', { src: img, alt: name, class: 'tb-sheet__img' }) : null,
      extra || null,
      oracleOf(name) ? h('p', { class: 'tb-adj__oracle' }, oracleOf(name)) : null,
      buttons.length ? h('div', { class: 'tb-sheet__actions' }, ...buttons) : null),
      actions: [Button('Fechar', { onClick: closeDialog })] });
  }
  const doBtn = (label, action, opts = {}) => Button(label, { block: true, variant: opts.variant, onClick: () => { closeDialog(); act(action); } });

  function moveButtons(v, oid) {
    const s = table.state, o = s.objects[oid];
    const dest = [['hand', 'Mão'], ['battlefield', 'Campo'], ['graveyard', 'Cemitério'], ['exile', 'Exílio']]
      .filter(([z]) => z !== o.zone).map(([z, label]) => doBtn(`Mover para ${label.toLowerCase()}`, { t: 'move', p: v, oid, to: z }));
    dest.push(doBtn('Pôr no topo do grimório', { t: 'move', p: v, oid, to: 'library', top: true }));
    dest.push(doBtn('Pôr no fundo do grimório', { t: 'move', p: v, oid, to: 'library', top: false }));
    if (o.commander && o.zone !== 'command') dest.push(doBtn('Voltar para a zona de comando', { t: 'move', p: v, oid, to: 'command' }));
    if (o.zone === 'companion') return [];
    return dest;
  }
  const hasPriority = v => { const s = table.state; return s.status === 'playing' && !s.pending && s.turn.priority === v; };

  function openObject(oid) {
    const s = table.state, v = table.viewer(), o = s.objects[oid];
    if (!o) return;
    // A3: primeiro as ações de regra que o motor oferece para este objeto
    const f = s.facts[o.name];
    const costTxt = f.cost ? costLabel(f.cost, o.zone === 'command' ? E.commanderTax(s, v, oid) : 0) : '';
    const legal = E.legalActions(s, v).filter(a => a.oid === oid).map(a =>
      a.t === 'play_land' ? doBtn('Jogar terreno', a, { variant: 'primary' })
        : a.t === 'cast' ? doBtn((o.zone === 'command' ? `Conjurar da zona de comando (imposto ${E.commanderTax(s, v, oid)})` : 'Conjurar') + (s.manaCheck && costTxt ? ` · ${costTxt}` : ''), a, { variant: 'primary' })
          : a.t === 'discard' ? doBtn('Descartar', a, { variant: 'primary' })
            : a.t === 'companion' ? doBtn(`Pôr na mão · {${E.COMPANION_COST}}`, a, { variant: 'primary' }) : null).filter(Boolean);
    // M7: mana da fonte, uma opção por cor que ela gera
    if (o.zone === 'battlefield' && E.legalActions(s, v).some(a => a.t === 'tap_mana' && a.oid === oid))
      f.produces.forEach((opt, k) => legal.push(doBtn(`Gerar ${opt.map(c => `{${c}}`).join('')}`, { t: 'tap_mana', p: v, oid, option: k })));
    // mesa assistida: conjurar sem pagar quando o tempo é legal mas falta mana
    if (s.manaCheck && hasPriority(v) && (o.zone === 'hand' || o.zone === 'command') && !legal.some(b => /Conjurar/.test(b.textContent)) && !f.types.includes('land')) {
      let timingOk = false; try { E.apply(s, { t: 'cast', p: v, oid, free: true }); timingOk = true; } catch (e) { /* fora de hora */ }
      if (timingOk) { legal.push(Button(`Conjurar · ${costTxt || 'sem custo'} — mana insuficiente`, { block: true, disabled: true })); legal.push(doBtn('Conjurar sem pagar (ajuste manual)', { t: 'cast', p: v, oid, free: true })); }
    }
    if (o.zone === 'companion' && hasPriority(v) && !legal.length && !s.players[v].companionUsed) {
      let ok = false; try { E.apply(s, { t: 'companion', p: v, oid, free: true }); ok = true; } catch (e) { /* fora de hora */ }
      if (ok) legal.push(doBtn('Pôr na mão sem pagar (ajuste manual)', { t: 'companion', p: v, oid, free: true }));
    }
    const direct = [];
    if (hasPriority(v)) {
      if (o.zone === 'battlefield') {
        direct.push(doBtn(o.tapped ? 'Desvirar' : 'Virar', { t: 'tap', p: v, oid }));
        direct.push(doBtn('Marcador +1/+1', { t: 'counter', p: v, oid, kind: 'p1p1', delta: 1 }));
        direct.push(doBtn('Marcador −1/−1', { t: 'counter', p: v, oid, kind: 'm1m1', delta: 1 }));
        if (Object.keys(o.counters).length) direct.push(doBtn('Remover um marcador', { t: 'counter', p: v, oid, kind: Object.keys(o.counters)[0], delta: -1 }));
        direct.push(doBtn('1 de dano', { t: 'damage', p: v, oid, delta: 1 }));
      }
      if (o.zone !== 'stack' || true) direct.push(...moveButtons(v, oid));
    }
    const where = h('p', { class: 'ds-text ds-text--sm ds-text--muted' }, `${s.players[o.owner].name} · ${T.ZONE_PT[o.zone] || 'companheiro (fora do jogo)'}${o.tapped ? ' · virada' : ''}${costTxt ? ' · ' + costTxt : ''}`);
    sheet(o.name, [...legal, ...direct], where);
  }

  function openZone(p, zone, label) {
    const s = table.state;
    const ids = s.zones[p][zone];
    Dialog({ title: `${label} de ${s.players[p].name}`, body: ids.length
      ? h('div', { class: 'tb-zonegrid' }, ...ids.slice().reverse().map(oid => TableCard({ ...s.objects[oid], image: imgOf(s.objects[oid].name) }, { onClick: () => { closeDialog(); openObject(oid); } })))
      : Empty('Vazio.'), actions: [Button('Fechar', { onClick: closeDialog })] });
  }

  function openLife(target) {
    const s = table.state, v = table.viewer();
    if (!hasPriority(v)) return toast('Espere sua prioridade para ajustar a vida');
    const btns = [[-1, '−1'], [-5, '−5'], [1, '+1'], [5, '+5']].map(([d, l]) => Button(l, { onClick: () => { closeDialog(); act({ t: 'life', p: v, target, delta: d }); } }));
    const cmd = s.format === 'commander' ? Object.values(s.objects).filter(o => o.commander && o.owner !== target).map(o =>
      doBtn(`+1 de dano de comandante (${o.name})`, { t: 'commander_damage', p: v, target, source: o.oid, delta: 1 })) : [];
    const dmg = Object.entries(s.players[target].commanderDamage).map(([oid, d]) => `${s.objects[oid].name}: ${d}`).join(' · ');
    Dialog({ title: `Vida de ${s.players[target].name}: ${s.players[target].life}`, body: Stack({},
      h('div', { class: 'tb-lifepad' }, ...btns), ...cmd, dmg ? Text('Dano de comandante: ' + dmg, { size: 'sm', tone: 'muted' }) : null),
      actions: [Button('Fechar', { onClick: closeDialog })] });
  }

  function openLog() {
    const lines = table.lines.slice().reverse();
    Dialog({ title: 'Registro', body: lines.length ? h('ol', { class: 'tb-log', reversed: true }, ...lines.map(l => h('li', { dataset: { turn: String(l.startsWith('—')) } }, l))) : Empty('Nada aconteceu ainda.'),
      actions: [Button('Fechar', { onClick: closeDialog })] });
  }

  /* ---- pintura ---- */
  const tagsOf = (s, o) => [o.attacking != null ? 'ataca' : null, o.blocking ? 'bloqueia' : null, plan.blocks.has(o.oid) ? `→ ${s.objects[plan.blocks.get(o.oid)].name.split(',')[0]}` : null].filter(Boolean);
  const cardsOf = (s, ids, onClick) => ids.map(oid => TableCard({ ...s.objects[oid], image: imgOf(s.objects[oid].name) },
    { onClick: () => onBoardTap(oid) || onClick(oid), tags: tagsOf(s, s.objects[oid]), selected: plan.attack.has(oid) || plan.blocks.has(oid), eligible: plan.eligible.has(oid) }));
  const isLand = (s, oid) => s.facts[s.objects[oid].name].types.includes('land');

  function side(s, p, mine) {
    const z = s.zones[p];
    const lands = z.battlefield.filter(o => isLand(s, o)), others = z.battlefield.filter(o => !isLand(s, o));
    const pl = s.players[p];
    const chips = h('div', { class: 'tb-chips' },
      mine || pl.dummy ? null : ZoneChip('Mão', z.hand.length, null),
      pl.dummy ? null : ZoneChip('Grimório', z.library.length, () => {
        const v = table.viewer();
        if (!hasPriority(v)) return;
        Dialog({ title: `Grimório de ${pl.name}`, body: Text(`${z.library.length} carta(s).`, { tone: 'muted' }),
          actions: [Button('Comprar 1', { onClick: () => { closeDialog(); act({ t: 'draw', p: v, target: p, n: 1 }); } }), Button('Fechar', { onClick: closeDialog })] });
      }, mine ? 'tb-lib-me' : 'tb-lib-opp'),
      ZoneChip('Cemitério', z.graveyard.length, () => openZone(p, 'graveyard', 'Cemitério')),
      ZoneChip('Exílio', z.exile.length, () => openZone(p, 'exile', 'Exílio')),
      s.format === 'commander' ? ZoneChip('Comando', z.command.length, () => openZone(p, 'command', 'Zona de comando')) : null,
      z.companion.length ? ZoneChip('Companheiro', z.companion.length, () => openZone(p, 'companion', 'Companheiro'), mine ? 'tb-comp-me' : 'tb-comp-opp') : null,
      poolView(pl));
    const life = LifeCounter({ name: pl.name + (pl.lost ? ' (fora)' : ''), life: pl.life, active: s.turn.active === p,
      sub: null, onClick: () => openLife(p), id: mine ? 'tb-life-me' : 'tb-life-opp' });
    const field = [ZoneRow('Permanentes', cardsOf(s, others, openObject), { zone: 'permanents', empty: 'nenhuma' }), ZoneRow('Terrenos', cardsOf(s, lands, openObject), { zone: 'lands', empty: 'nenhum' })];
    return h('section', { class: ['tb-side', mine ? 'tb-side--me' : 'tb-side--opp'].join(' '), 'aria-label': mine ? 'seu lado' : 'lado do oponente' },
      h('div', { class: 'tb-side__head' }, life, chips),
      ...(mine ? field : field.reverse()));
  }

  function dock(s, v) {
    const pl = s.players[v];
    let banner;
    if (s.status === 'over') {
      banner = PriorityBanner({ title: s.winner == null ? 'Empate' : `${s.players[s.winner].name} venceu`, hint: s.players.filter(x => x.lost).map(x => `${x.name}: ${x.lossReason}`).join(' · '), tone: 'accent',
        actions: [Button('Nova partida', { variant: 'primary', id: 'tb-new', onClick: async () => { await store.remove(T.SAVE_KEY); go('/mesa'); } }), Button('Registro', { onClick: openLog })] });
    } else if (s.status === 'mulligan') {
      const need = pl.mulligans;
      banner = need && bottomPick.size <= need ? PriorityBanner({ title: `Escolha ${need} carta(s) para o fundo`, hint: `${bottomPick.size} de ${need} escolhida(s). Toque nas cartas da mão.`,
        actions: [Button('Confirmar', { variant: 'primary', id: 'tb-keep', disabled: bottomPick.size !== need, onClick: () => { const b = [...bottomPick]; bottomPick = new Set(); act({ t: 'keep', p: v, bottom: b }); } }),
          Button('Mulligan de novo', { onClick: () => { bottomPick = new Set(); act({ t: 'mulligan', p: v }); } })] })
        : PriorityBanner({ title: `${pl.name}: mão inicial`, hint: pl.mulligans ? `${pl.mulligans} mulligan(s) feito(s)` : 'Manter ou embaralhar e comprar 7 de novo.',
          actions: [Button('Manter', { variant: 'primary', id: 'tb-keep', onClick: () => act({ t: 'keep', p: v, bottom: [] }) }), Button('Mulligan', { id: 'tb-mull', onClick: () => act({ t: 'mulligan', p: v }) })] });
    } else if (s.pending && s.pending.kind === 'attackers' && s.pending.p === v) {
      banner = PriorityBanner({ title: 'Declarar atacantes', hint: `Toque nas criaturas que vão atacar. ${plan.eligible.size} podem atacar.`,
        actions: [Button(plan.attack.size ? `Atacar com ${plan.attack.size}` : 'Atacar', { variant: 'primary', id: 'tb-attack', disabled: !plan.attack.size, onClick: () => { const list = [...plan.attack]; resetPlan(); act({ t: 'attack', p: v, attackers: list }); } }),
          Button('Sem ataque', { id: 'tb-no-attack', onClick: () => { resetPlan(); act({ t: 'attack', p: v, attackers: [] }); } })] });
    } else if (s.pending && s.pending.kind === 'blockers' && s.pending.p === v) {
      const blocks = [...plan.blocks.entries()];
      const pv = E.previewCombat(s, blocks);
      const hint = pv ? `Prévia: você ${pv.life[v] < 0 ? 'perde ' + (-pv.life[v]) : 'não perde'} de vida` + (pv.died.length ? ` · morrem: ${pv.died.join(', ')}` : '') : 'Bloqueio inválido (ameaça pede dois bloqueadores).';
      banner = PriorityBanner({ title: 'Declarar bloqueadores', hint: 'Toque nas suas criaturas para escolher quem bloqueiam. ' + hint, tone: 'warning',
        actions: [Button(blocks.length ? `Bloquear (${blocks.length})` : 'Confirmar', { variant: 'primary', id: 'tb-block', disabled: !blocks.length || !pv, onClick: () => { resetPlan(); act({ t: 'block', p: v, blocks }); } }),
          Button('Sem bloqueio', { id: 'tb-no-block', onClick: () => { resetPlan(); act({ t: 'block', p: v, blocks: [] }); } })] });
    } else if (s.pending && s.pending.kind === 'discard') {
      banner = PriorityBanner({ title: `Descarte ${s.pending.n} carta(s)`, hint: 'Mão acima de 7 na limpeza. Toque nas cartas da mão.', tone: 'warning', actions: [] });
    } else if (s.turn.priority === v) {
      const top = s.stack.length ? s.objects[s.stack[s.stack.length - 1]].name : null;
      banner = PriorityBanner({
        title: top ? `Pilha: ${top}` : `Sua prioridade · ${E.STEP_PT[s.turn.step]}`,
        hint: top ? 'Responda ou passe. Se todos passarem, o topo resolve.' : (s.turn.active === v ? 'Seu turno.' : `Turno de ${s.players[s.turn.active].name}.`),
        actions: [Button('Passar', { variant: 'primary', id: 'tb-pass', onClick: () => act({ t: 'pass', p: v }) }),
          top ? null : Button('Passar o turno', { id: 'tb-pass-turn', onClick: () => {
            const start = s.turn.number;
            try { const ev = table.passUntil(v, n => n.turn.number !== start && n.turn.active === v && n.turn.step === 'main1');
              const res = ev.filter(e => e.kind === 'resolved' && e.adjudicate).pop(); if (res) adjudicating = { name: res.name, oid: res.oid };
            } catch (e) { toast(e.message); }
            save(); paint();
          } })].filter(Boolean)
      });
    } else {
      banner = PriorityBanner({ title: `Aguardando ${s.players[s.turn.priority].name}`, actions: [] });
    }

    const hand = s.zones[v].hand.map(oid => TableCard({ ...s.objects[oid], image: imgOf(s.objects[oid].name, 'normal') }, {
      size: 'hand', selected: bottomPick.has(oid),
      onClick: () => {
        if (s.status === 'mulligan' && pl.mulligans) { bottomPick.has(oid) ? bottomPick.delete(oid) : bottomPick.size < pl.mulligans && bottomPick.add(oid); return paint(); }
        if (s.pending && s.pending.kind === 'discard' && s.pending.p === v) return act({ t: 'discard', p: v, oid });
        openObject(oid);
      }
    }));
    return h('div', { class: 'tb-dock' }, banner,
      h('div', { class: 'tb-hand', 'aria-label': 'sua mão' }, hand.length ? h('div', { class: 'tb-row' }, ...hand) : h('span', { class: 'tb-zone__empty' }, 'mão vazia')));
  }

  function paint() {
    const s = table.state;
    const v = table.viewer();
    // A9 · hot-seat: quem recebe o aparelho confirma antes de ver a mão
    if (table.humans().length > 1 && v !== shownViewer && s.status !== 'over') { handoff = true; shownViewer = v; }
    if (handoff) {
      return mount(root, h('div', { class: 'tb-handoff', id: 'tb-handoff' },
        Text('Passe o aparelho', { size: 'sm', tone: 'muted' }),
        Text(s.players[v].name, { size: '3xl', display: true }),
        Text(s.status === 'mulligan' ? 'para decidir a mão inicial.' : s.pending && s.pending.kind === 'blockers' ? 'para declarar bloqueadores.' : s.pending && s.pending.kind === 'attackers' ? 'para declarar atacantes.' : `para responder · ${E.STEP_PT[s.turn.step]}`, { tone: 'muted' }),
        Button(`Sou ${s.players[v].name}, mostrar a mesa`, { variant: 'primary', id: 'tb-reveal', onClick: () => { handoff = false; paint(); } })));
    }
    syncPlan(s, v);
    const opp = s.players.map((_, i) => i).find(i => i !== v);
    const stackItems = s.stack.map(oid => ({ ...s.objects[oid], image: imgOf(s.objects[oid].name), who: s.players[s.objects[oid].controller].name, onClick: () => openObject(oid) }));
    const adj = adjudicating && s.status !== 'over' ? AdjudicationPanel({
      name: adjudicating.name, image: imgOf(adjudicating.name), oracle: oracleOf(adjudicating.name),
      controls: hasPriority(v) ? [Button('Comprar 1', { onClick: () => act({ t: 'draw', p: v, target: v, n: 1 }) })] : [],
      onDone: () => { adjudicating = null; paint(); }
    }) : null;
