const PENDING_ACTIONS = { commander_zone: ['commander_zone', 'concede'], discard: ['discard', 'concede'], choose_type: ['choose_type', 'concede'], choose_pair: ['choose_pair', 'concede'], unless: ['take_loss', 'pay_unless', 'concede'], free_cast: ['cast_free', 'decline_free', 'concede'], sacrifice: ['sacrifice', 'concede'], choose_mode: ['choose_mode', 'concede'], choose_dungeon: ['choose_dungeon', 'concede'], choose_room: ['choose_room', 'concede'], attackers: ['attack', 'concede'], blockers: ['block', 'concede'], triggers: ['order_trigger', 'concede'], choose_color: ['choose_color', 'concede'], pick: ['pick', 'pick_done', 'concede'], pick_target: ['pick_target', 'concede'], may_pay: ['pay', 'decline', 'concede'], madness: ['cast_madness', 'decline_madness', 'concede'] };

function apply(state, action) {
  if (!action || !HANDLERS[action.t]) throw new RuleError('acao', 'ação desconhecida: ' + (action && action.t));
  if (state.status === 'over') throw new RuleError('fim', 'partida encerrada');
  if (!state.players[action.p] || state.players[action.p].lost) throw new RuleError('jogador', 'jogador inválido');
  if (state.status === 'mulligan' && !MULLIGAN_ACTIONS.has(action.t)) throw new RuleError('fase', 'termine os mulligans primeiro');
  if (state.pending && !PENDING_ACTIONS[state.pending.kind].includes(action.t)) {
    const k = state.pending.kind;
    throw new RuleError('pendente', k === 'discard' ? `descarte ${state.pending.n} carta(s) primeiro` : k === 'attackers' ? 'declare os atacantes primeiro'
      : k === 'triggers' ? 'escolha a ordem dos gatilhos primeiro' : k === 'choose_color' ? 'escolha a cor primeiro'
      : k === 'commander_zone' ? 'decida se o comandante volta para a zona de comando primeiro'
      : k === 'choose_type' ? 'escolha o tipo de criatura primeiro'
      : k === 'choose_pair' ? 'escolha o par do vínculo de alma primeiro'
      : k === 'choose_mode' ? 'escolha o que o gatilho faz primeiro'
      : k === 'free_cast' ? 'decida se conjura sem pagar primeiro'
      : k === 'unless' ? 'decida se paga ou perde vida primeiro'
      : k === 'sacrifice' ? 'escolha o que sacrificar primeiro'
      : k === 'choose_dungeon' ? 'escolha a masmorra primeiro'
      : k === 'choose_room' ? 'escolha a próxima sala primeiro'
        : k === 'pick' ? 'termine a escolha de cartas primeiro' : k === 'pick_target' ? 'escolha o alvo do gatilho primeiro'
          : k === 'may_pay' ? 'decida se paga primeiro' : k === 'madness' ? 'decida a insanidade primeiro' : 'declare os bloqueadores primeiro');
  }
  const s = clone(state);
  const events = [];
  HANDLERS[action.t](s, action, events);
  stateBased(s, events);
  flushTriggers(s, events); // M9: gatilhos entram na pilha antes de alguém receber prioridade
  stateBased(s, events);
  return { state: s, events };
}

/** Todas as ações legais agora para o jogador p. */
function legalActions(s, p, { adjudication = false } = {}) {
  const out = [];
  if (s.status === 'over' || !s.players[p] || s.players[p].lost) return out;
  if (s.status === 'mulligan') {
    const pl = s.players[p]; if (pl.kept) return out;
    if (pl.mulligans < 3) out.push({ t: 'mulligan', p });
    out.push({ t: 'keep', p, bottom: s.zones[p].hand.slice(0, pl.mulligans) });
    return out;
  }
  if (s.pending) {
    const k = s.pending.kind;
    if (s.pending.p !== p) return out;
    if (k === 'discard') s.zones[p].hand.forEach(oid => out.push({ t: 'discard', p, oid }));
    if (k === 'attackers') {
      const el = eligibleAttackers(s, p);
      const obrig = mustAttack(s, p); // S59 · provocadas entram em todo conjunto oferecido
      if (!obrig.length) out.push({ t: 'attack', p, attackers: [] });
      else out.push({ t: 'attack', p, attackers: obrig.slice() });
      if (el.length > 1) out.push({ t: 'attack', p, attackers: el.slice() });
      el.forEach(oid => out.push({ t: 'attack', p, attackers: [...new Set([oid, ...obrig])] }));
    }
    if (k === 'choose_color') ['W', 'U', 'B', 'R', 'G'].forEach(color => out.push({ t: 'choose_color', p, color }));
    if (k === 'commander_zone') { out.push({ t: 'commander_zone', p, yes: true }); out.push({ t: 'commander_zone', p, yes: false }); }
    if (k === 'pick_target') s.pending.options.forEach((o, index) => out.push({ t: 'pick_target', p, index }));
    if (k === 'madness') {
      const o = s.objects[s.pending.oid];
      const need = (s.facts[o.name].script.effects || []).filter(SC.isTargeted);
      if (!s.manaCheck || canPay(s, p, parseCost(s.pending.cost))) {
        if (!need.length) out.push({ t: 'cast_madness', p });
        else {
          let combos = [[]];
          for (const eff of need) {
            const opts = legalTargets(s, p, eff.target, s.pending.oid, eff.targetColor).filter(x => targetAllowed(s, eff, x)).slice(0, TARGET_LIMIT);
            if (!opts.length) { combos = []; break; }
            combos = addTarget(combos, opts);
          }
          combos.forEach(targets => out.push({ t: 'cast_madness', p, targets }));
        }
      }
      out.push({ t: 'decline_madness', p });
    }
    if (k === 'may_pay') { if (!s.manaCheck || canPay(s, p, parseCost(s.pending.cost))) out.push({ t: 'pay', p }); out.push({ t: 'decline', p }); }
    if (k === 'choose_type') (s.pending.options || []).forEach((subtype, index) => out.push({ t: 'choose_type', p, index, subtype })); // S50
    if (k === 'choose_pair') { (s.pending.options || []).forEach((oid, index) => out.push({ t: 'choose_pair', p, index, oid })); out.push({ t: 'choose_pair', p, decline: true }); } // S51
    if (k === 'choose_mode') (s.pending.options || []).forEach((label, index) => out.push({ t: 'choose_mode', p, index, label })); // S56
    // S61 · conjurar sem pagar: uma opção por carta, com os alvos possíveis
    if (k === 'free_cast') {
      out.push({ t: 'decline_free', p });
      for (const oid of s.pending.options || []) {
        const fc = s.facts[s.objects[oid].name];
        if (fc.types.includes('land')) continue;
        const modos = (fc.script && fc.script.modes) || [];
        const listas = modos.length ? modos.map((m, i) => ({ need: (m.effects || []).filter(SC.isTargeted), mode: i }))
          : [{ need: ((fc.script && fc.script.effects) || []).filter(SC.isTargeted), mode: null }];
        for (const { need, mode } of listas) {
          const base = mode == null ? { t: 'cast_free', p, oid } : { t: 'cast_free', p, oid, mode };
          if (!need.length) { out.push(base); continue; }
          let combos = [[]];
          for (const eff of need) {
            const opts = legalTargets(s, p, eff.target, oid, eff.targetColor).filter(x => targetAllowed(s, eff, x)).slice(0, TARGET_LIMIT);
            if (!opts.length) { combos = []; break; }
            combos = addTarget(combos, opts);
          }
          combos.forEach(targets => out.push({ ...base, targets }));
        }
      }
    }
    // S60 · perder ou pagar, e escolher o que sacrificar
    if (k === 'unless') { out.push({ t: 'take_loss', p }); out.push({ t: 'pay_unless', p }); }
    if (k === 'sacrifice') (s.pending.options || []).forEach(oid => out.push({ t: 'sacrifice', p, oid }));
    // S57 · masmorra: escolher em qual entrar e para qual sala avançar
    if (k === 'choose_dungeon') (s.pending.options || []).forEach((name, index) => out.push({ t: 'choose_dungeon', p, index, label: (s.pending.labels || [])[index] || name }));
    if (k === 'choose_room') (s.pending.options || []).forEach((id, index) => out.push({ t: 'choose_room', p, index, label: (s.pending.labels || [])[index] || id }));
    if (k === 'pick') {
      const pk = s.pending;
      if (pk.picked.length < pk.max) pk.from.filter(oid => !pk.picked.includes(oid) && matchesFilter(s, s.objects[oid], pk.filter)).forEach(oid => out.push({ t: 'pick', p, oid }));
      if (pk.picked.length >= pk.min) out.push({ t: 'pick_done', p });
    }
    if (k === 'triggers') s.queued.filter(q => q.controller === p).forEach((q, i) => out.push({ t: 'order_trigger', p, index: i }));
    if (k === 'blockers') {
      out.push({ t: 'block', p, blocks: [] });
      const el = eligibleBlockers(s, p), atk = s.combat.attackers.filter(x => s.objects[x].zone === 'battlefield');
      for (const b of el) for (const a of atk) if (canBlock(s, b, a) && !has(s, s.objects[a], 'menace')) out.push({ t: 'block', p, blocks: [[b, a]] });
      for (const a of atk) {
        const can = el.filter(b => canBlock(s, b, a));
        if (can.length >= 2) out.push({ t: 'block', p, blocks: can.slice(0, 2).map(b => [b, a]) });
      }
    }
    return out;
  }
  if (s.turn.priority !== p) return out;
  out.push({ t: 'pass', p });
  const canSorcery = canSorceryNow(s, p);
  const payable = (o, extra) => !s.manaCheck || canPay(s, p, s.facts[o.name].cost, extra);
  const castWith = (o, need, mode) => {
    const base = mode != null ? { t: 'cast', p, oid: o.oid, mode } : { t: 'cast', p, oid: o.oid };
    if (!need.length) return [base];
    let combos = [[]];
    for (const eff of need) {
      const opts = legalTargets(s, p, eff.target, o.oid, eff.targetColor).filter(x => targetAllowed(s, eff, x)).slice(0, TARGET_LIMIT);
      // S38 · "até N alvos": o último alvo pode ficar de fora
      if (!opts.length) { if (eff.upTo) continue; return []; }
      combos = eff.upTo ? addTarget(combos, opts).concat(combos) : addTarget(combos, opts);
    }
    const vistos = new Set(); // S47 · dois alvos opcionais repetiam a mesma combinação
    return combos.filter(c => { const k = JSON.stringify(c); if (vistos.has(k)) return false; vistos.add(k); return true; })
      .map(targets => ({ ...base, targets }));
  };
  const casts = o => {
    const f = s.facts[o.name];
    const aura = auraTarget(f);
    if (aura) return castWith(o, [{ target: aura }]);
    const modes = (f.script && f.script.modes) || [];
    if (modes.length) return modes.flatMap((m, i) => castWith(o, (m.effects || []).filter(SC.isTargeted), i));
    return castWith(o, (f.script && f.script.effects || []).filter(SC.isTargeted));
  };
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid], f = s.facts[o.name];
    if (f.types.includes('land')) { if (canSorcery && s.players[p].landsPlayed < 1) out.push({ t: 'play_land', p, oid }); }
    else if ((canSorcery || !isSorcerySpeed(f)) && payable(o, castExtra(s, p, o, 0))) {
      // S50 · custo com X: a mesa oferece os valores de X que dá para pagar (até 4)
      if ((f.cost.x || 0) > 0) for (let x = 1; x <= 4; x++) { if (!payable(o, castExtra(s, p, o, x))) break; casts(o).forEach(c => out.push({ ...c, x })); }
      // S53 · o custo adicional pode ter opções ("descarte uma carta OU sacrifique um terreno") e ser opcional
      const addSpec = f.script && f.script.additional;
      const opcoes = Array.isArray(addSpec) ? addSpec : addSpec ? [addSpec] : [];
      const opcional = !!(f.script && f.script.additionalOptional);
      const pagaveis = opcoes.map((op, i) => ({ op, i })).filter(({ op }) => canPayExtra(s, p, op, oid));
      if (opcoes.length && !pagaveis.length && !opcional) continue;
      const sugestao = op => ({ ...(op.discard ? { discard: s.zones[p].hand.filter(x => x !== oid).slice(0, op.discard) } : {}),
        ...(op.sacrificeOther ? { sacrifice: extraCostCandidates(s, p, op.sacrificeOther, oid)[0] } : {}),
        ...(op.tapOther ? { tapOther: extraCostCandidates(s, p, op.tapOther, oid, true).slice(0, op.tapOther.amount || 1) } : {}) });
      if (!opcoes.length) casts(o).forEach(x => out.push(x));
      else {
        pagaveis.forEach(({ op, i }) => casts(o).forEach(x => out.push({ ...x, add: i, pay: sugestao(op) })));
        if (opcional) casts(o).forEach(x => out.push({ ...x, add: null }));
      }
    }
  }
  // S61 · Cavernas das Runas: as cartas exiladas que você pode jogar
  for (const oid of s.zones[p].exile) {
    const o = s.objects[oid]; if (!o || o.playableFromExile !== p) continue;
    const f = s.facts[o.name];
    if (f.types.includes('land')) { if (canSorcery && s.players[p].landsPlayed < 1) out.push({ t: 'play_land', p, oid }); continue; }
    if ((canSorcery || !isSorcerySpeed(f)) && payable(o, castExtra(s, p, o, 0))) casts(o).forEach(x => out.push(x));
  }
  // S54 · metamorfose: conjura virada para baixo por {3}, como criatura
  if (canSorcery) for (const oid of s.zones[p].hand) {
    const mp = (s.facts[s.objects[oid].name].script || {}).morph;
    if (mp && (!s.manaCheck || canPay(s, p, parseCost('{3}')))) out.push({ t: 'cast', p, oid, faceDown: true });
  }
  // S54 · virar para cima, a qualquer momento com prioridade
  for (const o of battlefield(s)) {
    if (o.controller !== p || !o.faceDown) continue;
    const mp = (s.facts[o.name].script || {}).morph;
    if (mp && (!s.manaCheck || canPay(s, p, parseCost(mp.mana)))) out.push({ t: 'unmorph', p, oid: o.oid });
  }
  // S53 · plot: paga e exila da mão, no tempo de feitiço
  if (canSorcery) for (const oid of s.zones[p].hand) {
    const pl = (s.facts[s.objects[oid].name].script || {}).plot;
    if (pl && (!s.manaCheck || canPay(s, p, parseCost(pl.mana)))) out.push({ t: 'plot', p, oid });
  }
  // S53 · conjurar de graça a carta plotada, num turno depois
  if (canSorcery) for (const oid of s.zones[p].exile) {
    const o = s.objects[oid];
    if (o.plotted == null || o.plotted >= s.turn.number || o.owner !== p) continue;
    const f = s.facts[o.name];
    castWith(o, (f.script && f.script.effects || []).filter(SC.isTargeted)).forEach(x => out.push({ ...x, plotted: true, add: null }));
  }
  // S29 · transmutar, da mão, no tempo de feitiço
  if (canSorcery) for (const oid of s.zones[p].hand) {
    const tm = (s.facts[s.objects[oid].name].script || {}).transmute;
    if (tm && (!s.manaCheck || canPay(s, p, parseCost(tm.mana)))) out.push({ t: 'transmute', p, oid });
  }
  // S22 · ciclar, da mão, a qualquer momento com prioridade
  for (const oid of s.zones[p].hand) {
    const cy = (s.facts[s.objects[oid].name].script || {}).cycling;
    if (cy && (!s.manaCheck || canPay(s, p, parseCost(cy.mana)))) out.push({ t: 'cycle', p, oid });
  }
  // S18 · ninjutsu, depois dos bloqueadores · S54 · esgueirar-se pelo mesmo caminho
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid]; const nj = ninjutsuOf(s, o);
    if (nj && (!s.manaCheck || canPay(s, p, parseCost(nj.mana))))
      unblockedAttackers(s, p).forEach(attacker => out.push({ t: 'ninjutsu', p, oid, attacker }));
    const sn = (s.facts[o.name].script || {}).sneak;
    if (sn && (!s.manaCheck || canPay(s, p, parseCost(sn.mana))))
      unblockedAttackers(s, p).forEach(attacker => out.push({ t: 'ninjutsu', p, oid, attacker, sneak: true }));
  }
  // S16 · custos alternativos da mão
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid], f = s.facts[o.name];
    if (f.types.includes('land')) continue;
    if (!(canSorcery || !isSorcerySpeed(f))) continue;
    altCosts(s, o).forEach((alt, i) => {
      if (!canPayAlt(s, p, alt.cost, oid)) return;
      const pay = defaultPayment(s, p, alt.cost, oid);
      castWith(o, ((alt.effects || (f.script && f.script.effects)) || []).filter(SC.isTargeted)).forEach(x => out.push({ ...x, alt: i, ...(Object.keys(pay).length ? { pay } : {}) }));
    });
  }
  // S37 · barganha: a mesma conjuração, sacrificando um artefato, encantamento ou ficha
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid]; if (!(s.facts[o.name].script || {}).bargain) continue;
    if (!(canSorcery || !isSorcerySpeed(s.facts[o.name]))) continue;
    if (s.manaCheck && !canPay(s, p, s.facts[o.name].cost, castExtra(s, p, o, 0))) continue;
    const candidatos = battlefield(s).filter(x => x.controller === p && x.oid !== oid &&
      (x.token || ['artifact', 'enchantment'].some(y => s.facts[x.name].types.includes(y))));
    if (candidatos.length) out.push({ t: 'cast', p, oid, bargain: true, pay: { bargain: candidatos[0].oid } });
  }
  // S41 · colher provas: a mesma conjuração, exilando cartas do seu cemitério
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid]; const n = (s.facts[o.name].script || {}).evidence;
    if (!n) continue;
    if (!(canSorcery || !isSorcerySpeed(s.facts[o.name]))) continue;
    if (s.manaCheck && !canPay(s, p, s.facts[o.name].cost, castExtra(s, p, o, 0))) continue;
    if (evidenceCards(s, p, n)) out.push({ t: 'cast', p, oid, evidence: true });
  }
  // S34 · conceder: conjura como aura, pelo custo de conceder
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid]; const bs = bestowOf(s, o);
    if (!bs || !(canSorcery || !isSorcerySpeed(s.facts[o.name]))) continue;
    if (s.manaCheck && !canPay(s, p, parseCost(bs.mana))) continue;
    legalTargets(s, p, 'creature', oid).slice(0, TARGET_LIMIT).forEach(t => out.push({ t: 'cast', p, oid, bestow: true, targets: [t] }));
  }
  // S24 · presságio: conjura a face de trás, da mão
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid]; const om = omenOf(s, o); const back = backOf(s, o);
    if (!om || !back) continue;
    const bf = s.facts[back];
    if (!(canSorcery || !isSorcerySpeed(bf))) continue;
    if (s.manaCheck && !canPay(s, p, parseCost(om.mana))) continue;
    castWith({ ...o, name: back }, ((bf.script && bf.script.effects) || []).filter(SC.isTargeted)).forEach(x => out.push({ ...x, oid, omen: true }));
  }
  // S24 · disturb: conjura a face de trás, do cemitério
  for (const oid of s.zones[p].graveyard) {
    const o = s.objects[oid]; const db = disturbOf(s, o); const back = backOf(s, o);
    if (!db || !back) continue;
    if (!canSorcery) continue;
    if (s.manaCheck && !canPay(s, p, parseCost(db.mana))) continue;
    out.push({ t: 'cast', p, oid, disturb: true });
  }
  // S16 · lampejo do passado, conjurando do cemitério
  for (const oid of s.zones[p].graveyard) {
    const o = s.objects[oid], f = s.facts[o.name];
    const fb = flashbackOf(s, o); if (!fb) continue;
    if (!(canSorcery || !isSorcerySpeed(f))) continue;
    if (fb.mana && s.manaCheck && !canPay(s, p, parseCost(fb.mana))) continue;
    if (!canPayExtra(s, p, fb, oid)) continue;
    const add = (f.script && f.script.additional) || null;
    if (add && !canPayExtra(s, p, add, oid)) continue;
    const pay = { ...(fb.tapOther ? { tapOther: extraCostCandidates(s, p, fb.tapOther, oid, true).slice(0, fb.tapOther.amount || 1) } : {}),
      ...(add && add.sacrificeOther ? { sacrifice: extraCostCandidates(s, p, add.sacrificeOther, oid)[0] } : {}) };
    castWith(o, (f.script && f.script.effects || []).filter(SC.isTargeted)).forEach(x => out.push({ ...x, flashback: true, ...(Object.keys(pay).length ? { pay } : {}) }));
  }
  // S48 · fuga: conjura do cemitério e a carta fica em jogo (Sentinel's Eyes)
  for (const oid of s.zones[p].graveyard) {
    const o = s.objects[oid], f = s.facts[o.name];
    const esc = escapeOf(s, o); if (!esc) continue;
    if (!(canSorcery || !isSorcerySpeed(f))) continue;
    if (esc.mana && s.manaCheck && !canPay(s, p, parseCost(esc.mana))) continue;
    if (!canPayAlt(s, p, esc, oid)) continue;
    const alvo = auraTarget(f);
    const need = alvo ? [{ target: alvo }] : (f.script && f.script.effects || []).filter(SC.isTargeted);
    castWith(o, need).forEach(x => out.push({ ...x, escape: true }));
  }
  for (const oid of s.zones[p].command) {
    const o = s.objects[oid], f = s.facts[o.name];

  }
  if (canSorcery && !s.players[p].companionUsed)
    for (const oid of s.zones[p].companion) if (!s.manaCheck || canPay(s, p, { generic: COMPANION_COST, colored: {}, hybrid: [], x: 0 })) out.push({ t: 'companion', p, oid });
  for (const o of sources(s, p)) out.push({ t: 'tap_mana', p, oid: o.oid, option: 0 });
  // S37 · habilidades ativadas a partir da mão (descartar esta carta: ...)
  for (const oid of s.zones[p].hand) {
    const o = s.objects[oid];
    abilitiesOf(s, o).filter(x => x.kind === 'activated' && (x.cost || {}).fromHand).forEach((ab, index) => {

      // S45 · a habilidade da mão pode pedir mais de um alvo, e o último pode ficar de fora
      let combos = [[]];
      for (const eff of need) {
        const opts = legalTargets(s, p, eff.target, oid).slice(0, TARGET_LIMIT);
        if (!opts.length) { if (eff.upTo) continue; return; }
        combos = eff.upTo ? addTarget(combos, opts).concat(combos) : addTarget(combos, opts);
      }
      combos.forEach(targets => out.push({ t: 'activate', p, oid, index, fromHand: true, targets }));
    });
  }
  // M9 · habilidades ativadas das suas permanentes
  for (const o of battlefield(s)) {
    if (o.controller !== p) continue;
    abilitiesOf(s, o).filter(x => x.kind === 'activated').forEach((ab, index) => {
      if ((ab.cost || {}).fromHand) return; // S37 · só vale com a carta na mão
      if (ab.sorceryOnly && !canSorcery) return;

    case 'draw': L.push(`${who(before, a.target ?? a.p)} comprou ${a.n || 1}`); break;
    case 'counter': L.push(`${P} ${(a.delta || 1) > 0 ? 'pôs' : 'tirou'} marcador em ${nameOf(before, a.oid)}`); break;
    case 'damage': L.push(`${nameOf(before, a.oid)} recebeu ${a.delta || 1} de dano`); break;
    case 'commander_damage': L.push(`${who(before, a.target)} recebeu ${a.delta || 1} de dano de comandante de ${nameOf(before, a.source)}`); break;
    case 'discard': L.push(`${P} descartou ${nameOf(before, a.oid)}`); break;
    case 'pick': L.push(`${P} escolheu ${nameOf(before, a.oid)}`); break;
    case 'pick_target': L.push(`${P} escolheu o alvo do gatilho`); break;
    case 'transmute': L.push(`${P} transmutou ${nameOf(before, a.oid)}`); break;
    case 'cycle': L.push(`${P} ciclou ${nameOf(before, a.oid)}`); break;
    case 'ninjutsu': L.push(`${P} usou ninjutsu: ${nameOf(before, a.attacker)} voltou e ${nameOf(before, a.oid)} entrou atacando`); break;
    case 'cast_madness': L.push(`${P} conjurou ${nameOf(before, before.pending.oid)} por insanidade`); break;
    case 'decline_madness': L.push(`${P} deixou ${nameOf(before, before.pending.oid)} ir para o cemitério`); break;
    case 'pay': L.push(`${P} pagou para a mágica não ser anulada`); break;
    case 'decline': L.push(`${P} deixou a mágica ser anulada`); break;
    case 'pick_done': L.push(`${P} terminou a escolha`); break;
    case 'commander_zone': { const o = before.objects[a.oid || (before.pending || {}).oid]; const onde = { graveyard: 'no cemitério', exile: 'no exílio', hand: 'na mão', library: 'no grimório' }[(before.pending || {}).from] || 'onde caiu';
      L.push(a.yes ? `${P} levou ${o ? o.name : 'o comandante'} para a zona de comando` : `${P} deixou ${o ? o.name : 'o comandante'} ${onde}`); break; }
    case 'choose_color': L.push(`${P} escolheu ${{ W: 'branco', U: 'azul', B: 'preto', R: 'vermelho', G: 'verde' }[a.color]}`); break;
    case 'concede': L.push(`${P} desistiu`); break;
    case 'attack': L.push(a.attackers.length ? `${P} atacou com ${a.attackers.map(o => nameOf(before, o)).join(', ')}` : `${P} não atacou`); break;
    case 'block': L.push(a.blocks.length ? `${P} bloqueou: ${a.blocks.map(([b, x]) => `${nameOf(before, b)} → ${nameOf(before, x)}`).join(', ')}` : `${P} não bloqueou`); break;
    case 'tap_mana': { const o = before.objects[a.oid]; const opt = (E.productions(before, o)[a.option || 0] || []).map(c => `{${c}}`).join(''); L.push(`${P} gerou ${opt} com ${o.name}`); break; }
    case 'companion': L.push(`${P} pôs o companheiro ${nameOf(before, a.oid)} na mão${a.free ? ' (sem pagar)' : ` ({${E.COMPANION_COST}})`}`); break;
    case 'activate': {
      const alvo = (a.targets || []).map(x => x.player != null ? who(before, x.player) : nameOf(before, x.oid)).join(' + ');
      L.push(`${P} ativou ${nameOf(before, a.oid)}${alvo ? ` → ${alvo}` : ''}`); break;
    }
    case 'order_trigger': L.push(`${P} escolheu a ordem dos gatilhos`); break;
    case 'add_mana': L.push(`${P} ${(a.delta || 1) > 0 ? 'adicionou' : 'tirou'} {${a.color}} da reserva`); break;
    default: break;
  }
  if (a.t === 'cast' && a.free) L[L.length - 1] += ' (sem pagar)';
  // dano de combate e mortes que acontecem ao passar
  if (a.t === 'pass' || a.t === 'block' || a.t === 'attack') {
    after.players.forEach((pl, i) => { const d = pl.life - before.players[i].life; if (d) L.push(`${pl.name}: vida ${before.players[i].life} → ${pl.life}`); });

  }
  for (const ev of events) {
    if (ev.kind === 'effect') L.push(effectLine(ev));
    if (ev.kind === 'fizzled') L.push(`${ev.name} foi anulada: o alvo não estava mais lá`);
    if (ev.kind === 'storm') L.push(`Tempestade: ${ev.name} copiou ${ev.amount} vez(es)`);
    if (ev.kind === 'choice') L.push(`${ev.name}: ${ev.what} (${ev.amount} carta(s))`);
    if (ev.kind === 'trigger-fizzled') L.push(`Gatilho de ${ev.name} não teve alvo legal`);
    if (ev.kind === 'room') L.push(`${ev.target} se aventurou na masmorra: ${ev.dungeon} — ${ev.name}`); // S57
    if (ev.kind === 'trigger') L.push(`Gatilho de ${ev.name} (${TRIGGER_PT[ev.when] || ev.when})`);
    if (ev.kind === 'resolved' && !ev.scripted) L.push(`${ev.name} resolveu → ${ZONE_PT[ev.to]}`);
    if (ev.kind === 'died') L.push(`${ev.name} morreu`);
    if (ev.kind === 'lost') L.push(`${who(after, ev.p)} perdeu: ${REASON_PT[ev.reason] || ev.reason}`);
    if (ev.kind === 'over') L.push(ev.winner == null ? 'Fim de partida: empate' : `Fim de partida: ${who(after, ev.winner)} venceu`);
  }
  if (after.status === 'playing' && (before.status !== 'playing' || after.turn.number !== before.turn.number))
    L.push(`— Turno ${after.turn.number} · ${who(after, after.turn.active)} —`);
  return L;
}

/** Revela informação oculta? Compra, mulligan e embaralhamento revelam. */
function revealed(before, after) {
  if (before.status === 'mulligan') return true;
  // S13/S14: olhar o grimório revela informação oculta
  if ((before.pending && before.pending.kind === 'pick') || (after.pending && after.pending.kind === 'pick')) return true;
  return before.zones.some((z, p) => after.zones[p].library.length < z.library.length);
}

const ACTIVE_STOPS = new Set(['main1', 'combat_attackers', 'main2']);
const RESPONSE_STOPS = new Set(['combat_attackers', 'end']);
/** Onde um humano para: pilha com resposta possível, suas fases de ação
    e, no turno alheio, ataque e passo final quando tem o que conjurar. */
function shouldStop(s, i) {
  const respond = E.legalActions(s, i).some(a => a.t !== 'pass' && a.t !== 'tap_mana'); // gerar mana sozinho não é resposta
  if (s.stack.length) return respond;
  // E50 P2 · depois dos bloqueios declarados, quem tem resposta (pump, remoção, habilidade) para antes do dano —
  // o atacante primeiro (prioridade dele), depois o defensor. Antes o passo era pulado e o dano vinha direto.
  if (s.turn.step === 'combat_blockers' && s.combat && (s.combat.attackers || []).length) return respond;
  if (s.turn.active === i) return s.turn.step === 'combat_attackers' ? respond : ACTIVE_STOPS.has(s.turn.step); // a declaração em si já é uma parada (pendência)
  if (s.players[s.turn.active].dummy && s.turn.step === 'combat_attackers') return false; // goldfish não ataca
  return respond && RESPONSE_STOPS.has(s.turn.step);
}

function createTable(setup, { log = [], marks = null, options: opts = {} } = {}) {
  // B3 · um assento pode ser dirigido pelo bot: { nivel, seat }
  // U10 · um bot só: partidas salvas contra o "amador" ou o "profissional" continuam como Shark

  if (options.bot) {
    const assento = (setup.players || [])[options.bot.seat];

  function fechaResumoDoBot() {
    if (!options.bot || !motivosDoBot.length) return;
    const nome = (match.state.players[options.bot.seat] || {}).name || 'Bot';
    const resumo = [`Resumo do turno ${turnoDoBot} · ${nome}`, ...__m25.resumoDoTurno(motivosDoBot).map(l => '  ' + l)];

  /** Goldfish mantém a mão e passa sempre. Humanos passam sozinhos onde

  function autopilot() {

          : pd.kind === 'choose_color' ? { t: 'choose_color', p: pd.p, color: 'W' }
          : pd.kind === 'commander_zone' ? { t: 'commander_zone', p: pd.p, yes: true } // M13
          : pd.kind === 'choose_type' ? { t: 'choose_type', p: pd.p, index: 0 }
          : pd.kind === 'choose_pair' ? { t: 'choose_pair', p: pd.p, index: 0 }
          : pd.kind === 'choose_mode' ? { t: 'choose_mode', p: pd.p, index: 0 }
          : pd.kind === 'free_cast' ? { t: 'decline_free', p: pd.p } // S61 · o goldfish não conjura de graça
          : pd.kind === 'unless' ? { t: 'take_loss', p: pd.p } // S60 · o goldfish aceita perder a vida
          : pd.kind === 'sacrifice' ? { t: 'sacrifice', p: pd.p, oid: (pd.options || [])[0] }
          : pd.kind === 'choose_dungeon' ? { t: 'choose_dungeon', p: pd.p, index: 0 }
          : pd.kind === 'choose_room' ? { t: 'choose_room', p: pd.p, index: 0 }
          : pd.kind === 'madness' ? { t: 'decline_madness', p: pd.p }
          : pd.kind === 'pick_target' ? { t: 'pick_target', p: pd.p, index: 0 }

  function rebuild(prefix) {

  if (log.length) { rebuild(log); marks = null; }

    get state() { return match.state; },
    get log() { return match.log; },
    get lines() { return lines.slice(); },
    get entradas() { return entradas.map(e => ({ ...e })); },
    get resumos() { return resumos.map(r => ({ ...r, linhas: r.linhas.slice() })); },
    setup,

    options,
    serialize() { return { kind: 'estante.match', engine: E.ENGINE_VERSION, setup, options, log: match.log, marks: humanMarks.slice(), savedAt: Date.now() }; }
  };
  return api;
}

/** Reabre uma partida salva. Lança se o motor mudou de versão. */
function restoreTable(data) {
  if (!data || data.kind !== 'estante.match') throw new Error('formato-desconhecido');
  if (data.engine !== E.ENGINE_VERSION) throw new Error('versao-do-motor');
  return createTable(data.setup, { log: data.log, marks: data.marks, options: data.options || {} });

/** U7 · de quem é a vez, do ponto de vista de quem segura o aparelho (v).

  /* ---- A6 · declaração de ataque e bloqueio ---- */
  const plan = { attack: new Set(), blocks: new Map(), eligible: new Set() };

  /** Durante a declaração, tocar numa criatura escolhe em vez de abrir a folha. */
