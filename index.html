<title>Estante · Magic: The Gathering</title>
<style>/* =====================================================================
   F4 · TOKENS
   Única fonte de cor, espaço, raio, elevação, tipografia e movimento.
   Nenhuma regra de componente pode escrever valor literal.

   Referências: Arena (mesa escura, carta como única cor viva),
   Scryfall (tipografia de dado, densidade sem ruído),
   Moxfield (densidade de lista).
   ===================================================================== */
:root {
  /* ---- espaço: escala de 4px ---- */
  --space-0: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* ---- raio ---- */
  --radius-1: 4px;
  --radius-2: 8px;
  --radius-3: 14px;
  --radius-full: 999px;
  --radius-card: 4.75%;

  /* ---- tipografia ---- */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 11px;   --lh-xs: 1.45;
  --text-sm: 12.5px; --lh-sm: 1.45;
  --text-md: 14px;   --lh-md: 1.5;
  --text-lg: 16px;   --lh-lg: 1.45;
  --text-xl: 20px;   --lh-xl: 1.3;
  --text-2xl: 27px;  --lh-2xl: 1.2;
  --text-3xl: 36px;  --lh-3xl: 1.1;
  --weight-regular: 400;
  --weight-medium: 600;
  --weight-bold: 700;

  /* ---- movimento ---- */
  --dur-1: 110ms;
  --dur-2: 180ms;
  --dur-3: 280ms;
  --ease-out: cubic-bezier(.22, .61, .36, 1);
  --ease-in-out: cubic-bezier(.45, .05, .55, .95);

  /* ---- camadas ---- */
  --z-base: 0;
  --z-sticky: 20;
  --z-overlay: 40;
  --z-modal: 60;
  --z-toast: 80;

  /* ---- alvo de toque ---- */
  --tap-min: 44px;

  /* ---- cor das manas: constante entre temas, é identidade de Magic ---- */
  --mana-w: #f5e6c8;
  --mana-u: #4a7fb5;
  --mana-b: #4b4453;
  --mana-r: #c05a3e;
  --mana-g: #3f8558;
  --mana-c: #8a8f99;
  /* U3 · tinta dos glifos sobre o círculo de mana e o aro do símbolo */
  --mana-ink-dark: #231a0e;
  --mana-ink-light: #fbf6ea;
  --mana-ring: rgba(20, 14, 6, .45);

  /* ---- tema escuro: nogueira e papel envelhecido ----
     Madeira é o móvel; a carta é o conteúdo. Nenhum tom de madeira
     aparece em texto ou em estado — só em fundo, superfície e borda. */
  --bg: #14100b;
  --bg-elev-1: #1f1811;
  --bg-elev-2: #2a2118;
  --bg-elev-3: #372c20;
  --border: #443626;
  --border-strong: #5e4b34;
  --fg: #f1e8d7;
  --fg-muted: #bcab90;
  --fg-subtle: #9c8b71;
  --accent: #cfa851;
  --accent-hover: #e8c375;
  --accent-fg: #18120a;
  --accent-soft: rgba(207, 168, 81, .16);
  /* U7 · cor do oponente na mesa (a sua é o acento) */
  --player-opp: #86acd8;
  --player-opp-fg: #0b1520;
  --player-opp-soft: rgba(134, 172, 216, .18);
  --positive: #6fae8d;
  --positive-fg: #0c1a13;
  --negative: #d4785f;
  --negative-fg: #1c0e09;
  --warning: #d9a33f;
  --overlay: rgba(10, 7, 4, .82);
  --scrim: rgba(20, 16, 11, .95);
  --grain-1: rgba(255, 244, 222, .022);
  --grain-2: rgba(0, 0, 0, .18);
  --shelf-edge: #4a3a27;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .42);
  --shadow-2: 0 4px 12px rgba(0, 0, 0, .48);
  --shadow-3: 0 12px 34px rgba(0, 0, 0, .6);
  --shadow-up: 0 -10px 28px -14px rgba(0, 0, 0, .6); /* U6b · sombra da folha inferior, para cima */
  /* U2 · profundidade de botão: brilho no topo, lábio embaixo, sombra curta; pressionado afunda */
  --btn-shine: rgba(255, 240, 210, .07);
  --btn-shine-accent: rgba(255, 250, 235, .16);
  --btn-rest: 0 1px 0 rgba(0, 0, 0, .38), 0 3px 6px -3px rgba(0, 0, 0, .55);
  --btn-pressed: inset 0 2px 3px rgba(0, 0, 0, .38);
  --focus-ring: 0 0 0 3px var(--accent-soft);
  color-scheme: dark;
}

/* ---- tema claro: papel e tinta, não inversão ---- */
:root[data-theme="light"] {
  --bg: #e7dbc4;
  --bg-elev-1: #f6eeda;
  --bg-elev-2: #e0d3b6;
  --bg-elev-3: #d1c09c;
  --border: #bda98a;
  --border-strong: #9a8560;
  --fg: #241b0f;
  --fg-muted: #57492f;
  --fg-subtle: #6b5b3c;
  --accent: #7a5a17;
  --accent-hover: #674b12;
  --accent-fg: #fdf8ea;
  --accent-soft: rgba(122, 90, 23, .15);
  --player-opp: #2c5a88;
  --player-opp-fg: #f4f8fc;
  --player-opp-soft: rgba(44, 90, 136, .14);
  --positive: #2a6349;
  --positive-fg: #f1f8f4;
  --negative: #92381f;
  --negative-fg: #fdf2ee;
  --warning: #8a6410;
  --overlay: rgba(46, 35, 18, .5);
  --scrim: rgba(246, 238, 218, .95);
  --grain-1: rgba(90, 62, 22, .035);
  --grain-2: rgba(120, 88, 40, .05);
  --shelf-edge: #b59a6c;
  --shadow-1: 0 1px 2px rgba(74, 56, 26, .14);
  --shadow-2: 0 4px 12px rgba(74, 56, 26, .18);
  --shadow-3: 0 12px 34px rgba(74, 56, 26, .24);
  --shadow-up: 0 -10px 28px -14px rgba(74, 56, 26, .24); /* U6b · sombra da folha inferior, para cima */
  --btn-shine: rgba(255, 252, 244, .5);
  --btn-shine-accent: rgba(255, 244, 214, .14);
  --btn-rest: 0 1px 0 rgba(92, 68, 30, .22), 0 3px 6px -3px rgba(74, 56, 26, .3);
  --btn-pressed: inset 0 2px 3px rgba(74, 56, 26, .22);
  color-scheme: light;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    --bg: #e7dbc4;
    --bg-elev-1: #f6eeda;
    --bg-elev-2: #e0d3b6;
    --bg-elev-3: #d1c09c;
    --border: #bda98a;
    --border-strong: #9a8560;
    --fg: #241b0f;
    --fg-muted: #57492f;
    --fg-subtle: #6b5b3c;
    --accent: #7a5a17;
    --accent-hover: #674b12;
    --accent-fg: #fdf8ea;
    --accent-soft: rgba(122, 90, 23, .15);
    --player-opp: #2c5a88;
    --player-opp-fg: #f4f8fc;
    --player-opp-soft: rgba(44, 90, 136, .14);
    --positive: #2a6349;
    --positive-fg: #f1f8f4;
    --negative: #92381f;
    --negative-fg: #fdf2ee;
    --warning: #8a6410;
    --overlay: rgba(46, 35, 18, .5);
    --scrim: rgba(246, 238, 218, .95);
    --grain-1: rgba(90, 62, 22, .035);
    --grain-2: rgba(120, 88, 40, .05);
    --shelf-edge: #b59a6c;
    --shadow-1: 0 1px 2px rgba(74, 56, 26, .14);
    --shadow-2: 0 4px 12px rgba(74, 56, 26, .18);
    --shadow-3: 0 12px 34px rgba(74, 56, 26, .24);
    --shadow-up: 0 -10px 28px -14px rgba(74, 56, 26, .24); /* U6b · sombra da folha inferior, para cima */
    --btn-shine: rgba(255, 252, 244, .5);
    --btn-shine-accent: rgba(255, 244, 214, .14);
    --btn-rest: 0 1px 0 rgba(92, 68, 30, .22), 0 3px 6px -3px rgba(74, 56, 26, .3);
    --btn-pressed: inset 0 2px 3px rgba(74, 56, 26, .22);
    color-scheme: light;
  }
}

/* =====================================================================
   F5 · BASE + COMPONENTES
   Toda propriedade visual sai de token. Nenhum literal de cor aqui.
   ===================================================================== */

/* ---------------- reset e base ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: var(--lh-md);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------------- primitivas ---------------- */
.ds-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.ds-row { display: flex; align-items: center; gap: var(--space-2); }
.ds-row--wrap { flex-wrap: wrap; }
.ds-grow { flex: 1; min-width: 0; }
.ds-center { display: grid; place-items: center; }
.ds-wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 var(--space-4); }

.ds-surface { background: var(--bg-elev-1); border-radius: var(--radius-2); box-shadow: var(--shadow-1); }
.ds-surface--flat { box-shadow: none; border: 1px solid var(--border); }
.ds-surface--raised { background: var(--bg-elev-2); box-shadow: var(--shadow-2); }
.ds-surface--pad { padding: var(--space-4); }

.ds-text { margin: 0; }
.ds-text--display { font-family: var(--font-display); font-weight: var(--weight-regular); }
.ds-text--xs { font-size: var(--text-xs); line-height: var(--lh-xs); }
.ds-text--sm { font-size: var(--text-sm); line-height: var(--lh-sm); }
.ds-text--md { font-size: var(--text-md); line-height: var(--lh-md); }
.ds-text--lg { font-size: var(--text-lg); line-height: var(--lh-lg); }
.ds-text--xl { font-size: var(--text-xl); line-height: var(--lh-xl); }
.ds-text--2xl { font-size: var(--text-2xl); line-height: var(--lh-2xl); }
.ds-text--3xl { font-size: var(--text-3xl); line-height: var(--lh-3xl); }
.ds-text--muted { color: var(--fg-muted); }
.ds-text--subtle { color: var(--fg-subtle); }
.ds-text--accent { color: var(--accent); }
.ds-text--mono { font-family: var(--font-mono); }
.ds-text--caps { text-transform: uppercase; letter-spacing: .09em; font-size: var(--text-xs); color: var(--fg-muted); }

/* ---------------- botão ---------------- */
.ds-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--tap-min); padding: 0 var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-1);
  background-color: var(--bg-elev-2); background-image: linear-gradient(180deg, var(--btn-shine), transparent 70%); color: var(--fg);
  box-shadow: var(--btn-rest);
  font-size: var(--text-md); font-weight: var(--weight-medium);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: background-color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out),
              color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out),
              box-shadow var(--dur-1) var(--ease-out);
}
@media (hover: hover) { .ds-btn:hover { border-color: var(--border-strong); background-color: var(--bg-elev-3); } }
/* U2 · toque: o botão afunda (desce 1px, encolhe 3%, a sombra vira interna) — retorno imediato sem esperar a ação */
.ds-btn:active:not([disabled]) { transform: translateY(1px) scale(.97); box-shadow: var(--btn-pressed); }
.ds-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.ds-btn--primary { background-color: var(--accent); background-image: linear-gradient(180deg, var(--btn-shine-accent), transparent 70%); color: var(--accent-fg); border-color: var(--accent); }
@media (hover: hover) { .ds-btn--primary:hover { background-color: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); } }
.ds-btn--ghost { background-color: transparent; background-image: none; border-color: transparent; color: var(--fg-muted); box-shadow: none; }
@media (hover: hover) { .ds-btn--ghost:hover { background-color: var(--bg-elev-2); color: var(--fg); border-color: transparent; } }
.ds-btn--ghost:active:not([disabled]) { background-color: var(--bg-elev-2); color: var(--fg); box-shadow: none; }
.ds-btn--danger { color: var(--negative); border-color: var(--border); }
.ds-btn--danger:hover { background: var(--negative); color: var(--negative-fg); border-color: var(--negative); }
.ds-btn--block { width: 100%; }
.ds-btn--icon { width: var(--tap-min); padding: 0; }
.ds-btn--icone { width: var(--tap-min); padding: 0; flex: none; }
.ds-btn .ds-icon { flex: none; }
.ds-btn__rotulo { min-width: 0; }
.ds-btn:has(> .ds-icon + .ds-btn__rotulo) { padding-left: var(--space-3); }
@media (prefers-reduced-motion: reduce) { .ds-btn:active:not([disabled]) { transform: none; } }

/* leva 102 · visor da carta: grande, nítida, com o texto embaixo */
.ds-carta-img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ds-visor__moldura { position: relative; width: min(100%, 380px); aspect-ratio: 488 / 680; margin: 0 auto var(--space-4); border-radius: 4.75% / 3.5%; overflow: hidden;
  background: var(--bg-elev-2); box-shadow: var(--shadow-3); }
.ds-visor__moldura[data-carregando="true"]::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--fg) 8%, transparent) 50%, transparent 70%) 0 0 / 200% 100%; animation: ds-brilho 1.2s linear infinite; }
@keyframes ds-brilho { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .ds-visor__moldura[data-carregando="true"]::after { animation: none; } }
.ds-visor__moldura .ds-empty { height: 100%; display: flex; flex-direction: column; justify-content: center; }
.ds-visor__texto { display: flex; flex-direction: column; gap: var(--space-2); }
.ds-visor__cabeca { align-items: flex-start; flex-wrap: nowrap; gap: var(--space-2); }
.ds-visor__cabeca > .ds-text { min-width: 0; overflow-wrap: anywhere; }
.ds-visor__custo { flex: none; font-size: 18px; white-space: nowrap; }
.ds-visor__tipo { gap: var(--space-2); align-items: center; }
.ds-visor__oracle { margin: var(--space-1) 0 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-2); background: var(--bg-elev-2); border: 1px solid var(--border);
  font-size: var(--text-md); line-height: 1.5; white-space: pre-wrap; color: var(--fg); }

/* U4 · sem internet mais visual: anel de progresso, linha por item com estado desenhado, aviso de uma linha */
.ds-anel { position: relative; flex: none; width: var(--anel, 64px); height: var(--anel, 64px); display: grid; place-items: center; }
.ds-anel svg { position: absolute; inset: 0; }
.ds-anel__trilha { fill: none; stroke: var(--bg-elev-3); stroke-width: 6; }
.ds-anel__barra { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 600ms var(--ease-out); }
.ds-anel[data-cheio="true"] .ds-anel__barra { stroke: var(--positive); }
.ds-anel__num { position: relative; font-family: var(--font-display); font-size: var(--text-md); font-variant-numeric: tabular-nums; color: var(--fg); display: inline-flex; }
.ds-anel[data-cheio="true"] .ds-anel__num { color: var(--positive); }
.ds-offline__topo { display: flex; align-items: center; gap: var(--space-4); }
.ds-offline__titulo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ds-offline__estado-geral { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--fg-muted); }
.ds-offline__estado-geral[data-tom="pronto"] { color: var(--positive); }
.ds-offline__estado-geral[data-tom="offline"] { color: var(--warning); }
.ds-offline__lista { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-2); overflow: hidden; }
.ds-offline__linha { display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap-min); padding: var(--space-2) var(--space-3); background: var(--bg-elev-1); }
.ds-offline__linha + .ds-offline__linha { border-top: 1px solid var(--border); }
.ds-offline__icone { flex: none; width: 36px; height: 36px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--bg-elev-2); color: var(--fg-muted); }
.ds-offline__linha[data-estado="pronto"] .ds-offline__icone { color: var(--accent); }
.ds-offline__texto { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.ds-offline__texto strong { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg); }
.ds-offline__texto span { font-size: var(--text-xs); color: var(--fg-muted); }
.ds-offline__estado { flex: none; display: inline-flex; color: var(--fg-subtle); }
.ds-offline__linha[data-estado="pronto"] .ds-offline__estado { color: var(--positive); }
.ds-offline__linha[data-estado="parcial"] .ds-offline__estado, .ds-offline__linha[data-estado="falta"] .ds-offline__estado { color: var(--warning); }
.ds-aviso-rede { display: flex; align-items: center; gap: var(--space-2); min-height: 40px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-2);
  background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--fg); font-size: var(--text-sm); line-height: 1.35; }
.ds-aviso-rede .ds-icon { flex: none; color: var(--warning); }
.ds-empty--icone { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); }
.ds-empty__icone { width: 72px; height: 72px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--bg-elev-2); color: var(--fg-subtle); }
/* chip da barra: um ponto que pulsa devagar enquanto a internet não volta */
#nav-offline { position: relative; }
#nav-offline::before { content: ''; position: absolute; top: 5px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 0 0 var(--warning); animation: ds-pulso-rede 2.4s var(--ease-out) infinite; }
@keyframes ds-pulso-rede { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warning) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { #nav-offline::before { animation: none; } .ds-anel__barra { transition: none; } }

/* U2 · atalhos da tela inicial: ícone grande, uma palavra, detalhe curto */
.ds-atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.ds-atalho { flex-direction: column; align-items: flex-start; justify-content: space-between; gap: var(--space-3);
  min-height: 92px; padding: var(--space-3) var(--space-4); border-radius: var(--radius-2); text-align: left; }
.ds-atalho__icone { color: var(--accent); }
.ds-btn--primary .ds-atalho__icone { color: inherit; }
.ds-atalho__texto { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ds-atalho__rotulo { font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.15; font-weight: var(--weight-regular); }
.ds-atalho__detalhe { font-size: var(--text-xs); line-height: 1.35; opacity: .82; font-weight: var(--weight-regular); }
.ds-atalho--largo { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; min-height: 76px; gap: var(--space-4); }
.ds-atalho--largo .ds-atalho__icone svg { width: 30px; height: 30px; }

.ds-icones { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: var(--space-2); }
.ds-icones__item { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) 0; color: var(--fg); }
.ds-icones__item figcaption { font-size: var(--text-xs); color: var(--fg-muted); font-family: var(--font-mono); }
/* U2 · destino da barra: ícone com legenda de uma palavra embaixo */
.ds-nav { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 52px; min-height: var(--tap-min); padding: 3px var(--space-1) 2px; border-radius: var(--radius-1);
  color: var(--fg-muted); font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; position: relative;
  transition: color var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out); }
.ds-nav__rotulo { font-size: 11px; line-height: 1.1; font-weight: var(--weight-medium); letter-spacing: .01em; white-space: nowrap; }
.ds-nav[aria-current="page"] { color: var(--accent); }
.ds-nav[aria-current="page"]::after { content: ''; position: absolute; left: 30%; right: 30%; bottom: -1px; height: 2px; border-radius: 2px; background: currentColor; }
@media (hover: hover) { .ds-nav:hover { color: var(--fg); background: var(--bg-elev-2); } }
.ds-nav:active { transform: scale(.94); background: var(--bg-elev-2); }
.ds-nav--alerta { color: var(--warning); }
@media (prefers-reduced-motion: reduce) { .ds-nav:active { transform: none; } }
/* U2 · tema: os dois ícones moram no botão; o atributo escolhe qual aparece (sem trocar o conteúdo) */
[data-icone-tema="lua"] .ds-icon[data-icone="sol"], [data-icone-tema="sol"] .ds-icon[data-icone="lua"] { display: none; }

/* ---------------- campos ---------------- */
.ds-field { display: block; }
.ds-field__label { display: block; font-size: var(--text-sm); color: var(--fg-muted); margin-bottom: var(--space-1); }
.ds-field__hint { display: block; font-size: var(--text-xs); color: var(--fg-subtle); margin-top: var(--space-1); }
.ds-input, .ds-select, .ds-textarea {
  width: 100%; min-height: var(--tap-min);
  padding: var(--space-2) var(--space-3);
  background: var(--bg-elev-2); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius-1);
  transition: border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
}
.ds-textarea { min-height: 160px; resize: vertical; font-family: var(--font-mono); font-size: var(--text-sm); }
.ds-input:focus, .ds-select:focus, .ds-textarea:focus {
  outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
}
.ds-field--invalid .ds-input, .ds-field--invalid .ds-select, .ds-field--invalid .ds-textarea { border-color: var(--negative); }

/* ---------------- badge, chip ---------------- */
.ds-badge {
  display: inline-flex; align-items: center; gap: var(--space-1);
  padding: 2px var(--space-2); border-radius: var(--radius-1);
  border: 1px solid var(--border); color: var(--fg-muted);
  font-size: var(--text-xs); line-height: var(--lh-xs); white-space: nowrap;
}
.ds-badge--positive { color: var(--positive); border-color: var(--positive); }
.ds-badge--negative { color: var(--negative); border-color: var(--negative); }
.ds-badge--accent { color: var(--accent); border-color: var(--accent); }
.ds-badge--solid { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: var(--weight-medium); }

.ds-chip {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1);
  min-height: var(--tap-min); padding: 0 var(--space-3);
  border: 1px solid var(--border); border-radius: var(--radius-full);
  background: transparent; color: var(--fg-muted); font-size: var(--text-sm);
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.ds-chip:hover { border-color: var(--border-strong); color: var(--fg); }
.ds-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: var(--weight-medium); }
/* U3 · chip de cor: só o símbolo, redondo, com anel quando marcado */
.ds-chip--simbolo { width: var(--tap-min); padding: 0; justify-content: center; font-size: 24px; border-radius: var(--radius-full); }
.ds-chip--simbolo[aria-pressed="true"] { background: var(--bg-elev-2); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.ds-chip--simbolo[aria-pressed="false"] .ds-sym { opacity: .55; filter: saturate(.6); }
.ds-chip--simbolo .ds-sym { transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out); }
.ds-chip--simbolo[aria-pressed="true"] .ds-sym { transform: scale(1.06); }
/* U2 (parte 2) · chips com ícone, selo de contagem, lixeira discreta, seta de item de lista */
.ds-chip--icone { display: inline-flex; align-items: center; gap: 6px; }
/* U2 · controle segmentado: escolhas exclusivas numa pílula só, partes iguais, cabe em 360 */
.ds-segmentado { display: flex; flex: 1 1 100%; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--bg-elev-1); }
.ds-segmentado .ds-chip { flex: 1 1 0; min-width: 0; padding: 0 var(--space-1); gap: 4px; border-color: transparent; }
.ds-segmentado .ds-chip__rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-btn--voltar { margin-left: calc(-1 * var(--space-2)); padding-left: var(--space-2); }
.ds-chip--icone .ds-icon { flex: none; }
.ds-btn__conta { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-full); background: var(--accent); color: var(--accent-fg);
  font-size: var(--text-xs); font-weight: var(--weight-bold); line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.ds-btn__conta[hidden] { display: none; }
.ds-btn--perigo { color: var(--negative); }
@media (hover: hover) { .ds-btn--perigo:hover { color: var(--negative); background-color: var(--bg-elev-2); } }
.ds-list__seta { color: var(--fg-subtle); flex: none; margin-left: var(--space-1); }


/* ---------------- U3 · símbolo de mana ---------------- */
.ds-sym { display: inline-block; width: 1.08em; height: 1.08em; vertical-align: middle; top: -.08em; margin: 0 .05em; position: relative; flex: none; line-height: 0; }
.ds-sym svg { display: inline-block; vertical-align: top; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 1px 0 var(--mana-ring)); }
/* números e X/Y/Z: desenhados por CSS (fora do texto lido e copiado) */
.ds-sym--num::after { content: attr(data-num); position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-body);
  font-weight: 800; font-size: .7em; line-height: 1; letter-spacing: -.02em; color: var(--mana-ink-dark); pointer-events: none;
  padding-top: .09em; /* dígitos não têm descendente: sem isto o número fica alto no círculo */ }
.ds-sym--num2::after { font-size: .56em; letter-spacing: -.05em; }
.ds-sym--canto::after { inset: 0 45% 45% 0; font-size: .42em; }
.ds-sym--tinta-u::after, .ds-sym--tinta-b::after, .ds-sym--tinta-r::after, .ds-sym--tinta-g::after { color: var(--mana-ink-light); }
.ds-sym__aro { fill: none; stroke: var(--mana-ring); stroke-width: 1; }
.ds-sym__fundo { fill: var(--mana-b); }
.ds-sym__traco { stroke: var(--mana-b); }
/* o "{1}" original: fica no texto (copiar, buscar, testes) sem ocupar espaço nem quebrar linha */
.ds-sym__txt { display: inline-block; width: 0; height: 0; overflow: hidden; vertical-align: top; white-space: nowrap; opacity: 0; }
.ds-sym + .ds-sym { margin-left: .02em; }
.ds-comsimb { display: inline; white-space: inherit; }
.ds-pips { display: inline-flex; align-items: center; gap: 1px; font-size: 16px; line-height: 1; }
.ds-card__nome { line-height: 1.2; }
.ds-card__custo { font-size: 15px; line-height: 1; white-space: nowrap; }
.ds-card__tipo { font-family: var(--font-body); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.2; }

/* ---------------- pip de mana ---------------- */
.ds-pip {
  display: inline-block; width: 14px; height: 14px; border-radius: var(--radius-full);
  border: 1px solid var(--border-strong); vertical-align: -2px; margin-right: 2px;
}
.ds-pip--w { background: var(--mana-w); }
.ds-pip--u { background: var(--mana-u); }
.ds-pip--b { background: var(--mana-b); }
.ds-pip--r { background: var(--mana-r); }
.ds-pip--g { background: var(--mana-g); }
.ds-pip--c { background: var(--mana-c); }

/* ---------------- tabs ---------------- */
.ds-tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); }
.ds-tab {
  min-height: var(--tap-min); padding: 0 var(--space-4);
  color: var(--fg-muted); font-size: var(--text-md);
  border-bottom: 2px solid transparent;
  transition: color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.ds-tab:hover { color: var(--fg); }
.ds-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: var(--weight-medium); }

/* ---------------- lista ---------------- */
.ds-list { border: 1px solid var(--border); border-radius: var(--radius-2); overflow: hidden; background: var(--bg-elev-1); }
.ds-list__item {
  display: flex; align-items: center; gap: var(--space-3);
  width: 100%; min-height: 56px; padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border); text-align: left;
  transition: background-color var(--dur-1) var(--ease-out);
}
.ds-list__item:last-child { border-bottom: none; }
.ds-list__item:hover { background: var(--accent-soft); }
.ds-list__group {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--bg-elev-3); color: var(--accent);
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .09em;
  border-bottom: 1px solid var(--border);
}

/* ---------------- sheet e dialog ---------------- */
.ds-overlay {
  position: fixed; inset: 0; z-index: var(--z-modal);
  background: var(--overlay); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: var(--space-4);
  animation: ds-fade var(--dur-2) var(--ease-out);
}
.ds-overlay[data-open="true"] { display: flex; }
.ds-dialog {
  width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
  background: var(--bg-elev-1); border-radius: var(--radius-3);
  box-shadow: var(--shadow-3); padding: var(--space-5);
  animation: ds-rise var(--dur-2) var(--ease-out);
}
.ds-dialog__head { position: sticky; top: calc(-1 * var(--space-5)); z-index: 1; display: flex; align-items: flex-start; gap: var(--space-2);
  margin: calc(-1 * var(--space-5)) calc(-1 * var(--space-5)) var(--space-3); padding: var(--space-4) var(--space-3) var(--space-2) var(--space-5);
  background: var(--bg-elev-1); border-bottom: 1px solid transparent; }
.ds-dialog__head[data-rolou="true"] { border-bottom-color: var(--border); box-shadow: var(--shadow-1); }
.ds-dialog__title { font-family: var(--font-display); font-size: var(--text-xl); margin: 0; flex: 1 1 auto; min-width: 0; padding-top: 6px; }
.ds-dialog__fechar { flex: none; margin-top: -2px; }
.ds-dialog__actions { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; margin-top: var(--space-4); }
@keyframes ds-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes ds-rise { from { opacity: 0; transform: translateY(12px) scale(.985) } to { opacity: 1; transform: none } }

/* ---------------- toast ---------------- */
.ds-toast {
  position: fixed; left: 50%; bottom: calc(var(--space-5) + var(--doca-h, 0px)); z-index: var(--z-toast); max-width: calc(100vw - 2 * var(--space-4)); /* U6b · acima da bandeja da mesa */
  transform: translateX(-50%) translateY(10px);
  background: var(--fg); color: var(--bg);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-2);
  box-shadow: var(--shadow-3); font-size: var(--text-sm); font-weight: var(--weight-medium);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
.ds-toast[data-open="true"] { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- estados ---------------- */
.ds-empty {
  border: 1px dashed var(--border); border-radius: var(--radius-2);
  padding: var(--space-6) var(--space-4); text-align: center; color: var(--fg-muted);
}
.ds-note {
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-1); background: var(--bg-elev-1);
  padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--fg-muted);
}
.ds-note--warning { border-left-color: var(--warning); }
.ds-note--negative { border-left-color: var(--negative); }
.ds-spinner {
  width: 18px; height: 18px; border-radius: var(--radius-full);
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: ds-spin 700ms linear infinite;
}
@keyframes ds-spin { to { transform: rotate(360deg) } }

/* ---------------- carta ---------------- */
.ds-card {
  position: relative; display: block; width: 100%;
  aspect-ratio: 488 / 680; border-radius: var(--radius-card); overflow: hidden;
  background: var(--bg-elev-3); border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
  transition: transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.ds-card:hover { box-shadow: var(--shadow-2); }
.ds-card img { width: 100%; height: 100%; object-fit: cover; }
.ds-card__fallback {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1);
  padding: var(--space-2); text-align: center;
  font-family: var(--font-display); font-size: var(--text-sm); color: var(--fg);
}
.ds-cardgrid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
@media (min-width: 700px) { .ds-cardgrid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }

/* ---------------- barra de aplicação ---------------- */
.ds-appbar {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--scrim); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-1);
}
.ds-appbar__inner { display: flex; align-items: center; gap: var(--space-3); min-height: 56px; }
.ds-appbar__brand { font-family: var(--font-display); font-size: var(--text-lg); line-height: 1.1; display: inline-flex; align-items: center; min-height: var(--tap-min); }   /* homologação · o logotipo leva ao início: alvo de 44px */
.ds-appbar__brand small { display: block; font-family: var(--font-ui); font-size: var(--text-xs); color: var(--fg-muted); }

.ds-hidden { display: none !important; }
.ds-nowrap { white-space: nowrap; }

/* ===================== marca ===================== */
.brand { display: inline-flex; align-items: center; gap: var(--space-2); text-decoration: none; color: var(--fg); }
.brand-mark { display: block; flex: none; }
/* E50 · o ladrilho do ícone na barra tem o mesmo relevo dos botões */
.brand-tile { display: inline-flex; flex: none; border-radius: 9px; box-shadow: var(--btn-rest); transition: transform var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out); }
.brand-tile svg { display: block; border-radius: 9px; }
.ds-appbar__brand:active .brand-tile { transform: translateY(1px) scale(.96); box-shadow: var(--btn-pressed); }
@media (prefers-reduced-motion: reduce) { .ds-appbar__brand:active .brand-tile { transform: none; } }
.brand__name { display: flex; flex-direction: column; line-height: 1.05; }
.brand__word { font-family: var(--font-display); font-size: var(--text-lg); letter-spacing: .01em; }
.brand__tag { font-size: var(--text-xs); color: var(--fg-muted); letter-spacing: .06em; }

/* ===================== móvel: veio de madeira e ombro de prateleira =====================
   Textura de contraste muito baixo, só atrás de superfície, nunca sob texto. */
body {
  background-image:
    repeating-linear-gradient(94deg, var(--grain-1) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(88deg, var(--grain-2) 0 1px, transparent 1px 23px),
    radial-gradient(1200px 520px at 50% -12%, var(--bg-elev-1) 0%, transparent 62%);
  background-attachment: fixed;
}
.ds-surface { border: 1px solid var(--border); }
.ds-surface--shelf {
  background-image: repeating-linear-gradient(91deg, var(--grain-1) 0 2px, transparent 2px 9px);
  border-bottom: 3px solid var(--shelf-edge);
}
.ds-list__group { border-bottom: 2px solid var(--shelf-edge); }
.ds-list { border-bottom: 3px solid var(--shelf-edge); }
.ds-appbar { border-bottom: 2px solid var(--shelf-edge); }

/* ===================== L3 · galeria da lista ===================== */
.ds-text--positive { color: var(--positive); }
.ds-text--negative { color: var(--negative); }
.deck-group { margin-top: var(--space-5); }
.deck-group--reserva { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 2px dashed var(--border-strong); }
.deck-group--reserva .ds-cardgrid { opacity: .78; }
.deck-group__nota { margin-left: auto; }
.deck-reserva-aviso { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-2); border: 1px dashed var(--warning); background: var(--bg-elev-1); }
.deck-reserva-aviso__texto { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--text-sm); line-height: 1.4; }
.deck-reserva-aviso__texto .ds-icon { flex: none; color: var(--warning); margin-top: 1px; }
.deck-reserva-aviso .ds-btn { align-self: flex-start; }
.deck-group__head { align-items: baseline; border-bottom: 2px solid var(--shelf-edge); padding-bottom: var(--space-1); }
.deck-slot { position: relative; }
.deck-slot[data-missing="true"] .ds-card img { opacity: .42; filter: grayscale(.85); }
.deck-slot__qty, .deck-slot__flag {
  position: absolute; pointer-events: none; font-size: var(--text-xs); line-height: 1;
  padding: var(--space-1) var(--space-2); border-radius: var(--radius-full); font-weight: var(--weight-bold);
}
.deck-slot__qty { top: var(--space-2); left: var(--space-2); background: var(--accent); color: var(--accent-fg); }
.deck-slot__flag { bottom: var(--space-2); left: 50%; transform: translateX(-50%); background: var(--bg-elev-3); color: var(--fg); border: 1px solid var(--border-strong); white-space: nowrap; }
.deck-summary { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-5); }
.deck-summary__own { display: flex; flex-direction: column; gap: var(--space-1); }
.deck-curve { display: flex; align-items: flex-end; gap: var(--space-2); height: 96px; flex: 1; min-width: 200px; }
.deck-curve__col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: var(--space-1); }
.deck-curve__bar { width: 100%; min-height: 2px; background: var(--accent); border-radius: var(--radius-1) var(--radius-1) 0 0; }
.deck-curve__n, .deck-curve__cmc { font-size: var(--text-xs); color: var(--fg-muted); }
.ds-list__item .ds-stack { min-width: 0; }
.deck-item__texto { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); overflow-wrap: anywhere; }
.deck-item__nome { overflow-wrap: anywhere; hyphens: auto; }
.deck-item__lado { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); text-align: right; }
.deck-item__lado .ds-text { white-space: nowrap; }

/* ===================== A0 · mesa =====================
   A mesa é o interior da estante: madeira escura ao fundo, a carta como
   única cor viva. O banner de prioridade é o único elemento em destaque. */
.tb { padding-bottom: var(--space-4); }
.tb-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding-top: var(--space-3); }
.tb-top__actions { display: flex; gap: 2px; margin-left: auto; }
/* U2 · ferramentas da mesa ao lado da faixa de vez (antes ocupavam uma linha inteira) */
.tb-top > .tb-vez { flex: 1 1 0; min-width: 0; }
.tb-top > .tb-top__actions { order: 2; margin-left: 0; }
.tb-top > .tb-steps { order: 3; flex-basis: 100%; }
.tb-top__actions .ds-btn { color: var(--fg-muted); }
.tb-vez__rotulo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-steps { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.tb-steps__head { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--text-sm); color: var(--fg-muted); }
.tb-steps__head strong { color: var(--fg); font-family: var(--font-display); font-weight: var(--weight-regular); font-size: var(--text-md); }
.tb-steps__list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin: 0; padding: 0; list-style: none; }
.tb-steps__list li {
  font-size: var(--text-xs); text-align: center; padding: 2px 0; color: var(--fg-muted);
  border-bottom: 3px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tb-steps__list li[data-current="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: var(--weight-medium); }
.tb-steps__curto { display: none; }


.tb-board { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-3); }
.tb-side {
  display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);
  background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: var(--radius-2);
  border-bottom: 3px solid var(--shelf-edge);
}

    if (e.do === 'token') errs.push(...tokenErrors(e.token, `${label} ${i + 1}`));
    if (['search', 'look'].includes(e.do)) {
      if (e.to && !PICK_DESTS.includes(e.to)) errs.push(`${label} ${i + 1}: destino "${e.to}" desconhecido`);
      if (e.rest && !PICK_DESTS.includes(e.rest)) errs.push(`${label} ${i + 1}: resto "${e.rest}" desconhecido`);
      for (const t of (e.filter && e.filter.types) || []) if (!FILTER_TYPES.includes(t)) errs.push(`${label} ${i + 1}: filtro de tipo "${t}" desconhecido`);
      if (e.filter && e.filter.basic != null && typeof e.filter.basic !== 'boolean') errs.push(`${label} ${i + 1}: filtro "básico" precisa ser verdadeiro ou falso`);
      if (e.optional != null && typeof e.optional !== 'boolean') errs.push(`${label} ${i + 1}: "opcional" precisa ser verdadeiro ou falso`);
      for (const t of (e.filter && e.filter.subtypes) || []) if (typeof t !== 'string' || !t.trim()) errs.push(`${label} ${i + 1}: filtro de subtipo inválido`);
    }
    if (e.targetMv != null && !Number.isInteger(e.targetMv)) errs.push(`${label} ${i + 1}: valor de mana do alvo precisa ser inteiro`);
    // S38 · filtro de cor no alvo, varredura que poupa um subtipo e "até N alvos"
    if (e.targetNotColor != null && !'WUBRG'.includes(e.targetNotColor)) errs.push(`${label} ${i + 1}: cor excluída do alvo precisa ser WUBRG`);
    if (e.exceptSubtype != null) {
      if (typeof e.exceptSubtype !== 'string' || !e.exceptSubtype.trim()) errs.push(`${label} ${i + 1}: subtipo poupado precisa ser um nome`);
      if (!String(e.target || '').startsWith('each-')) errs.push(`${label} ${i + 1}: subtipo poupado só vale em varredura`);
    }
    if (e.onlyIf != null && !ONLY_IF.includes(e.onlyIf)) errs.push(`${label} ${i + 1}: condição "${e.onlyIf}" desconhecida`);
    // S47 · "até N alvos" vale do fim para trás: nenhum alvo obrigatório depois de um opcional
    if (e.upTo && (!isTargeted(e) || effects.slice(i + 1).some(x => isTargeted(x) && !x.upTo))) errs.push(`${label} ${i + 1}: "até N alvos" não pode vir antes de um alvo obrigatório`);
    if (e.do === 'add_mana' && !Array.isArray(e.symbols) && !e.anyColor) errs.push(`${label} ${i + 1}: add_mana precisa da lista de símbolos ou de anyColor`);
    if (e.targetMvMax != null) errs.push(...valueErrors(e.targetMvMax, `${label} ${i + 1}: valor de mana máximo`));
    if (e.do === 'keyword' && !KEYWORDS.includes(String(e.keyword || '').toLowerCase())) errs.push(`${label} ${i + 1}: palavra-chave "${e.keyword}" não é resolvida pelo motor`);
    if (e.unless && !e.unless.mana) errs.push(`${label} ${i + 1}: "a menos que pague" precisa de um custo de mana`);
    // S57 · duração do bônus: sem isso vale até o fim do turno
    if (e.until != null && e.until !== 'your-next-turn') errs.push(`${label} ${i + 1}: duração "${e.until}" desconhecida`);
    // S60 · o custo que evita a perda de vida, e o tipo do que se sacrifica
    if (e.do === 'lose_unless') {
      const c = e.cost || {};
      const partes = Object.keys(c);
      if (partes.length !== 1 || !['discard', 'sacrifice'].includes(partes[0])) errs.push(`${label} ${i + 1}: "a menos que" aceita descartar ou sacrificar, um de cada vez`);
      if (c.discard != null && !Number.isInteger(c.discard)) errs.push(`${label} ${i + 1}: descartar precisa de um número`);
      for (const t of c.sacrifice || []) if (!FILTER_TYPES.includes(t)) errs.push(`${label} ${i + 1}: tipo "${t}" desconhecido no sacrifício`);
    }
    if (e.do === 'sacrifice_own') {
      if (!(e.types || []).length) errs.push(`${label} ${i + 1}: sacrificar precisa dos tipos aceitos`);
      for (const t of e.types || []) if (!FILTER_TYPES.includes(t)) errs.push(`${label} ${i + 1}: tipo "${t}" desconhecido no sacrifício`);
    }
    // S59 · o que a carta escolhida recebe ao entrar no campo
    if (e.onPicked) {
      if (e.do !== 'look' && e.do !== 'search') errs.push(`${label} ${i + 1}: "onPicked" só vale em olhar ou vasculhar`);
      if (e.onPicked.counters != null && !Number.isInteger(e.onPicked.counters)) errs.push(`${label} ${i + 1}: marcadores da carta escolhida precisam ser inteiros`);
      if (e.onPicked.keyword && !KEYWORDS.includes(String(e.onPicked.keyword).toLowerCase())) errs.push(`${label} ${i + 1}: palavra-chave "${e.onPicked.keyword}" não é resolvida pelo motor`);
      if (e.onPicked.until != null && e.onPicked.until !== 'your-next-turn') errs.push(`${label} ${i + 1}: duração "${e.onPicked.until}" desconhecida`);
    }
    // efeito com escolha interrompe a resolução: o que vem depois não pode ter alvo
    if (CHOICE_EFFECTS.includes(e.do) && effects.slice(i + 1).some(isTargeted)) errs.push(`${label} ${i + 1} (${e.do}): efeito com alvo depois de uma escolha`);
    const t = e.target || 'self';
    // S42 · "no mesmo alvo": reaproveita o alvo já escolhido por um efeito anterior
    if (t === 'first-target') {
      if (!effects.slice(0, i).some(isTargeted)) errs.push(`${label} ${i + 1} (${e.do}): "no mesmo alvo" precisa de um alvo escolhido antes`);
    } else if (t !== 'self' && !spec.targets.includes(t)) errs.push(`${label} ${i + 1} (${e.do}): alvo "${t}" não vale aqui`);
  });
  return errs;
}
/** M12 · validação da ficha declarada num efeito. */
function tokenErrors(tk, label) {
  const errs = [];
  if (!tk || typeof tk.name !== 'string' || !tk.name.trim()) return [`${label}: ficha sem nome`];
  const types = tk.types || [];
  if (!Array.isArray(types) || !types.length) errs.push(`${label}: ficha sem tipo`);
  if (types.includes('creature')) for (const f of ['power', 'toughness']) if (!Number.isInteger(tk[f])) errs.push(`${label}: ficha de criatura precisa de ${f}`);
  for (const k of tk.keywords || []) if (!KEYWORDS.includes(String(k).toLowerCase())) errs.push(`${label}: palavra-chave "${k}" não é resolvida pelo motor`);
  for (const t of tk.subtypes || []) if (typeof t !== 'string' || !t.trim()) errs.push(`${label}: subtipo de ficha inválido`);
  for (const c of tk.colors || []) if (!'WUBRG'.includes(c)) errs.push(`${label}: cor de ficha "${c}" inválida`);
  if (tk.legendary != null && typeof tk.legendary !== 'boolean') errs.push(`${label}: "lendária" precisa ser verdadeiro ou falso`);
  for (const ab of tk.abilities || []) if (ab.kind !== 'activated' && ab.kind !== 'triggered') errs.push(`${label}: habilidade de ficha inválida`);
  return errs;
}

/** S8: nenhum script entra na biblioteca sem cenário de teste. */
function exampleErrors(sc) {
  const errs = [];
  const ex = sc && sc.example;
  if (!ex) return ['script sem cenário (example)'];
  if (!EXAMPLE_TARGETS.includes(ex.target || 'none')) errs.push(`cenário: alvo "${ex.target}" desconhecido`);
  if (!EXAMPLE_ACTIONS.includes(ex.action || 'cast')) errs.push(`cenário: ação "${ex.action}" desconhecida`);
  for (const k of Object.keys(ex.expect || {})) if (!EXAMPLE_CHECKS.includes(k)) errs.push(`cenário: verificação "${k}" desconhecida`);
  if (!Object.keys(ex.expect || {}).length) errs.push('cenário sem nada a verificar');
  return errs;
}
const isTargeted = e => TARGETED.has(e.target);

      const cur = items.get(it.key); if (cur) cur.qty += qty; else items.set(it.key, it);
      await persist(); return items.get(it.key).qty;
    },
    /** C1 · define a quantidade de um item (0 remove). */
    async setItem(key, qty) {
      await load(); const it = items.get(key); if (!it) return 0;
      const q = Math.max(0, Math.floor(Number(qty) || 0));
      if (q) it.qty = q; else items.delete(key);
      await persist(); return q;
    },
    /** C1 · muda acabamento, idioma, condição ou impressão; funde se já existir igual. */
    async updateItem(key, patch) {
      await load(); const it = items.get(key); if (!it) return null;
      const next = makeItem({ ...it, ...patch }, it.qty);
      items.delete(key);
      const dup = items.get(next.key); if (dup) dup.qty += next.qty; else items.set(next.key, next);
      await persist(); return next.key;
    },
    async toggle(name, target = 1) {
      const before = await api.qty(name);
      if (before > target) return { before, after: before, changed: false, reason: 'acima' };
      const after = before >= target ? 0 : target;
      await api.set(name, after);
      return { before, after, changed: true };
    },
    async markOwned(entries) {
      const need = new Map();
      for (const e of entries) { const k = norm(e.name); const cur = need.get(k) || { name: e.name, qty: 0 }; cur.qty += e.qty; need.set(k, cur); }
      let changed = 0;
      for (const { name, qty } of need.values()) if ((await api.qty(name)) < qty) { await api.set(name, qty); changed++; }
      return changed;
    },
    /** C3 · importa itens já normalizados. mode: 'add' soma, 'replace' substitui tudo. */
    async importItems(list, mode = 'add') {
      await load();
      if (mode === 'replace') items.clear();
      for (const p of list) { const it = makeItem(p, p.qty); const cur = items.get(it.key); if (cur) cur.qty += it.qty; else items.set(it.key, it); }
      await persist(); return list.length;
    },
    /** C13 · visão, agrupamento e ordenação lembrados por aparelho. */
    async prefs() { return { visao: 'lista', agrupar: '', ordenar: 'nome', painel: true, ...((await store.get(PREFS)) || {}) }; },
    async savePrefs(p) { const cur = await api.prefs(); await store.set(PREFS, { ...cur, ...p }); },
    /** C12b · visões salvas: nome + filtro, por aparelho. */
    async views() { return ((await store.get(VIEWS)) || []).map(v => ({ ...v })); },
    async saveView({ nome, filtro }) {
      const cur = await api.views();
      const v = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nome: String(nome || '').trim(), filtro };
      await store.set(VIEWS, [...cur, v]); return v;
    },
    async removeView(id) { const cur = await api.views(); await store.set(VIEWS, cur.filter(v => v.id !== id)); },
    /** H7 · desfaz uma importação pela diferença: tira só as cópias que ela somou (o que mudou depois fica). */
    async subtractItems(list) {
      await load();
      for (const p of list || []) { const it = makeItem(p, p.qty); const cur = items.get(it.key); if (!cur) continue; cur.qty -= it.qty; if (cur.qty <= 0) items.delete(it.key); }
      await persist(); return list.length;
    },
    async removePendingEntries(list) {
      const cur = await api.pending();
      for (const x of list || []) { const i = cur.findIndex(y => y.name === x.name && y.qty === x.qty && (y.raw || '') === (x.raw || '')); if (i >= 0) cur.splice(i, 1); }
      await store.set(PENDING, cur); return cur.length;
    },
    /** C11 · linhas de importação que não foram reconhecidas ficam aqui até serem corrigidas ou descartadas. */
    async pending() { return ((await store.get(PENDING)) || []).map(x => ({ ...x })); },
    async addPending(list) { const cur = await api.pending(); const next = [...cur, ...list.map(x => ({ name: x.name, qty: x.qty, set: x.set || '', number: x.number || '', finish: x.finish || '', raw: x.raw || '', reason: x.reason || '' }))]; await store.set(PENDING, next); return next.length; },
    async removePending(index) { const cur = await api.pending(); cur.splice(index, 1); await store.set(PENDING, cur); return cur.length; },
    async clearPending() { await store.set(PENDING, []); },
    /** Backup antigo (v1, por nome) e novo (v2, por impressão). */
    async merge(obj, nameMap = {}) {
      for (const [k, v] of Object.entries(obj || {})) if (v > 0 && (await api.qty(nameMap[k] || k)) < v) await api.set(nameMap[k] || k, v);
    },
    async mergeItems(list) {
      await load();
      for (const p of list || []) { if (!p || !p.name || !(p.qty > 0)) continue; const it = makeItem(p, p.qty); const cur = items.get(it.key); if (!cur || cur.qty < it.qty) items.set(it.key, it); }
      await persist();
    },
    async names() { const out = {}; for (const it of (await load()).values()) out[norm(it.name)] = it.name; return out; }
  };
  return api;
}

/* ---------------- C3 · CSV de coleção ----------------
   Reconhece colunas pelo cabeçalho, não pela posição: ManaBox, Moxfield,
   Archidekt, Delver Lens e planilhas próprias com cabeçalhos parecidos. */
function parseCSV(text) {
  const src = String(text || '').replace(/^\uFEFF/, '');
  const first = src.split(/\r?\n/, 1)[0] || '';
  const delim = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], field = '', quoted = false;
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (quoted) {
      if (ch === '"') { if (src[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && src[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}

const COLS = {
  name: ['name', 'card name', 'card'],
  qty: ['quantity', 'count', 'qty', 'amount', 'quantidade'],
  set: ['set code', 'edition code', 'set', 'edition', 'set_code'],
  set_name: ['set name', 'edition name'],
  number: ['collector number', "collector's number", 'card number', 'number', 'cn'],
  finish: ['foil', 'finish', 'printing'],
  cond: ['condition'],
  lang: ['language', 'lang'],
  id: ['scryfall id', 'scryfall_id']
};
const SIGNATURES = [
  ['ManaBox', ['manabox id']], ['Moxfield', ['tradelist count']], ['Archidekt', ['edition code', 'finish']],
  ['Delver Lens', ["collector's number"]]
];
const COND_MAP = [[/^(nm|near[\s_]?mint|mint|m)$/, 'NM'], [/^(lp|lightly[\s_]?played|excellent|ex|slightly[\s_]?played|sp)$/, 'LP'],
  [/^(mp|moderately[\s_]?played|played|good|gd|pl)$/, 'MP'], [/^(hp|heavily[\s_]?played|light[\s_]?played)$/, 'HP'], [/^(dmg|damaged|poor|po)$/, 'DMG']];
const LANG_MAP = { english: 'en', en: 'en', portuguese: 'pt', 'português': 'pt', pt: 'pt', spanish: 'es', es: 'es', japanese: 'ja', ja: 'ja', jp: 'ja',
  german: 'de', de: 'de', french: 'fr', fr: 'fr', italian: 'it', it: 'it', russian: 'ru', ru: 'ru', korean: 'ko', ko: 'ko',
  'chinese simplified': 'zhs', zhs: 'zhs', 'simplified chinese': 'zhs', 'chinese traditional': 'zht', zht: 'zht', 'traditional chinese': 'zht' };

function normCond(v) { const s = String(v || '').trim().toLowerCase(); if (!s) return 'NM'; const m = COND_MAP.find(([re]) => re.test(s)); return m ? m[1] : 'NM'; }
function normLang(v) { const s = String(v || '').trim().toLowerCase(); return LANG_MAP[s] || (s.length <= 3 && s ? s : 'en'); }
function normFinish(v) { const s = String(v || '').trim().toLowerCase(); if (s === 'etched') return 'etched'; return ['foil', 'yes', 'true', '1', 'sim', 'y'].includes(s) ? 'foil' : ''; }

/** Lê um CSV de coleção. Devolve itens normalizados, linhas ignoradas com motivo e o formato reconhecido. */
function parseCollectionCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { items: [], skipped: [], format: null, error: 'arquivo vazio' };
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const idx = {};
  for (const [field, aliases] of Object.entries(COLS)) { for (const a of aliases) { const i = head.indexOf(a); if (i >= 0 && !Object.values(idx).includes(i)) { idx[field] = i; break; } } }
  if (idx.name == null) return { items: [], skipped: [], format: null, error: 'sem coluna de nome da carta' };
  const format = (SIGNATURES.find(([, cols]) => cols.every(c => head.includes(c))) || ['Planilha'])[0];
  const items = [], skipped = [];
  rows.slice(1).forEach((r, n) => {
    const get = f => idx[f] != null ? String(r[idx[f]] ?? '').trim() : '';
    const name = get('name');
    const qty = idx.qty != null ? parseInt(get('qty'), 10) : 1;
    if (!name) return skipped.push({ line: n + 2, reason: 'sem nome' });
    if (!Number.isFinite(qty) || qty < 1) return skipped.push({ line: n + 2, reason: `quantidade inválida em ${name}` });
    items.push({ name, qty, set: get('set').toLowerCase(), set_name: get('set_name'), number: get('number'),
      finish: normFinish(get('finish')), cond: normCond(get('cond')), lang: normLang(get('lang')), id: get('id') });
  });
  return { items, skipped, format, error: null };
}

const COND_EXPORT = { NM: 'Near Mint', LP: 'Lightly Played', MP: 'Moderately Played', HP: 'Heavily Played', DMG: 'Damaged' };
const LANG_EXPORT = { en: 'English', pt: 'Portuguese', es: 'Spanish', ja: 'Japanese', de: 'German', fr: 'French', it: 'Italian', ru: 'Russian', ko: 'Korean', zhs: 'Chinese Simplified', zht: 'Chinese Traditional' };
/** Exporta no cabeçalho de coleção do Moxfield, que outros apps e a própria Estante leem. */
function exportCollectionCSV(list) {
  const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = ['Count,Name,Edition,Condition,Language,Foil,Collector Number'];
  for (const it of list) lines.push([it.qty, it.name, it.set, it.set ? COND_EXPORT[it.cond] || 'Near Mint' : '', it.set ? LANG_EXPORT[it.lang] || 'English' : '', it.finish, it.number].map(q).join(','));
  return lines.join('\n') + '\n';
}

/* ---------------- categorias e estatística ---------------- */
const CATEGORIES = [
  ['commander', 'Comandante'], ['companion', 'Companheiro'], ['creature', 'Criaturas'], ['planeswalker', 'Planeswalkers'],
  ['battle', 'Batalhas'], ['instant', 'Instantâneas'], ['sorcery', 'Feitiços'],
  ['artifact', 'Artefatos'], ['enchantment', 'Encantamentos'], ['land', 'Terrenos'],
  ['other', 'Outros'], ['side', 'Reserva']
];
function categoryOf(entry, card) {
  if (entry.zone === 'commander') return 'commander';
  if (entry.zone === 'companion') return 'companion';
  if (entry.zone === 'side') return 'side';
  const t = String(card && card.type_line || '').toLowerCase().split('//')[0];
  for (const k of ['land', 'creature', 'planeswalker', 'battle', 'instant', 'sorcery', 'artifact', 'enchantment']) if (t.includes(k)) return k;
  return 'other';
}

const isBasic = card => /\bbasic\b/i.test(card && card.type_line || '');
const anyNumber = card => /a deck can have any number of cards named/i.test(card && card.oracle_text || '');

function deckStats(deck, cards, owned) {
  let main = 0, side = 0, companion = 0, have = 0, need = 0;
  const curve = [0, 0, 0, 0, 0, 0, 0];
  for (const e of deck.entries) {
    const c = cards.get(norm(e.name));
    if (e.zone === 'side') side += e.qty; else if (e.zone === 'companion') companion += e.qty; else main += e.qty;
    need += e.qty;
    have += Math.min(e.qty, owned[norm(e.name)] || 0);
    if ((e.zone === 'main' || e.zone === 'commander') && c && !/\bland\b/i.test(c.type_line)) curve[Math.min(6, Math.floor(c.cmc || 0))] += e.qty;
  }
  return { main, side, companion, have, need, missing: need - have, curve };
}

/* ---------------- L11 · companheiro ----------------
   O companheiro começa fora do jogo: não conta nas 100 do Commander nem
   nas 60 do Pauper. A condição dele vale para o deck inicial inteiro
   (no Commander, comandante incluído). */
const isCompanionCard = c => /(^|\n)companion\s+—/i.test(c && c.oracle_text || '');
const typeOf = c => String(c && c.type_line || '').split('//')[0];
const isLandCard = c => /\bland\b/i.test(typeOf(c));
const isPermanentCard = c => /\b(land|creature|artifact|enchantment|planeswalker|battle)\b/i.test(typeOf(c));
const oracleNoReminder = c => String(c && c.oracle_text || '').replace(/\([^)]*\)/g, '');
const symbols = cost => (String(cost || '').match(/\{[^}]+\}/g) || []);
const CARD_TYPES = ['artifact', 'battle', 'creature', 'enchantment', 'instant', 'kindred', 'tribal', 'planeswalker', 'sorcery'];
/** Condições dos companheiros, verificáveis com os dados da Scryfall. */
const COMPANIONS = {
  'lurrus of the dream-den': { rule: 'cada permanente do deck tem valor de mana 2 ou menos', card: c => !isPermanentCard(c) || (c.cmc || 0) <= 2 },
  'gyruda, doom of depths': { rule: 'cada carta que não é terreno tem valor de mana par', card: c => isLandCard(c) || (c.cmc || 0) % 2 === 0 },
  'obosh, the preypiercer': { rule: 'cada carta que não é terreno tem valor de mana ímpar', card: c => isLandCard(c) || (c.cmc || 0) % 2 === 1 },
  'keruga, the macrosage': { rule: 'cada carta que não é terreno tem valor de mana 3 ou mais', card: c => isLandCard(c) || (c.cmc || 0) >= 3 },
  'jegantha, the wellspring': { rule: 'nenhuma carta tem mais de um do mesmo símbolo de mana no custo', card: c => { const s = symbols(c.mana_cost); return new Set(s).size === s.length; } },
  'kaheera, the orphanguard': { rule: 'cada criatura é Gato, Elemental, Pesadelo, Dinossauro ou Fera', card: c => !/\bcreature\b/i.test(typeOf(c)) || /\b(cat|elemental|nightmare|dinosaur|beast)\b/i.test(typeOf(c)) },
  'zirda, the dawnwaker': { rule: 'cada permanente tem uma habilidade ativada', card: c => !isPermanentCard(c) || isLandCard(c) || /:/.test(oracleNoReminder(c)) }, // terrenos têm habilidade de mana
  'umori, the collector': { rule: 'todas as cartas que não são terreno compartilham um tipo', deck: list => {
    const nonland = list.filter(({ card }) => !isLandCard(card));
    return CARD_TYPES.some(t => nonland.every(({ card }) => new RegExp('\\b' + t + '\\b', 'i').test(typeOf(card))));
  } },
  'lutri, the spellchaser': { rule: 'cada carta que não é terreno tem nome diferente', deck: list => list.filter(({ card }) => !isLandCard(card)).every(({ entry }) => entry.qty === 1) },
  'yorion, sky nomad': { rule: 'o deck tem pelo menos 20 cartas a mais que o mínimo', deck: (list, fmt) => list.reduce((s, x) => s + x.entry.qty, 0) >= (fmt === 'commander' ? 120 : 80) }
};

function validateCompanion(deck, cards, playing, add, fmt) {
  const comp = deck.entries.filter(e => e.zone === 'companion');
  if (!comp.length) return;
  if (comp.length > 1 || comp[0].qty > 1) add('error', 'Só pode haver um companheiro.');
  const e = comp[0], c = cards.get(norm(e.name));
  if (!c) return;
  if (!isCompanionCard(c)) return add('error', `${e.name} não tem a habilidade Companheiro.`);
  if (fmt === 'commander') {
    const ci = new Set(deck.entries.filter(x => x.zone === 'commander').flatMap(x => (cards.get(norm(x.name)) || {}).color_identity || []));
    if (ci.size && (c.color_identity || []).some(x => !ci.has(x))) add('error', `O companheiro ${e.name} está fora da identidade de cor do comandante.`);
  }
  const cond = COMPANIONS[norm(e.name)];
  if (!cond) return add('warning', `Condição do companheiro ${e.name} não é verificada automaticamente. Confira o texto da carta.`);
  const list = playing.map(entry => ({ entry, card: cards.get(norm(entry.name)) })).filter(x => x.card);
  if (cond.card) {
    const bad = list.filter(x => !cond.card(x.card)).map(x => x.entry.name);
    if (bad.length) add('error', `Condição de ${e.name} (${cond.rule}) quebrada por: ${bad.slice(0, 5).join(', ')}${bad.length > 5 ? '…' : ''}`);
  } else if (!cond.deck(list, fmt)) add('error', `Condição de ${e.name} não cumprida: ${cond.rule}.`);
}

/* ---------------- L5 · validação ---------------- */
/* M13b · parcerias do Commander (702.124, regras de 07/06/2024; textos conferidos em 30/09/2026).
 * Lê as linhas de palavra-chave do texto oficial, sem o lembrete entre parênteses. Variantes diferentes
 * não se combinam (702.124f). Variante "Partner—…" que o app não conhece vira aviso, nunca aprovação. */
function parceriasDe(c) {
  const out = [];
  const texto = String((c && c.oracle_text) || '').replace(/\([^)]*\)/g, '');
  for (const bruta of texto.split('\n')) {
    const l = bruta.trim(); let m;
    if (/^Partner$/i.test(l)) out.push({ tipo: 'partner' });
    else if ((m = l.match(/^Partner with (.+)$/i))) out.push({ tipo: 'with', nome: m[1].trim() });
    else if ((m = l.match(/^Partner\s*[—–-]\s*(.+)$/i))) out.push({ tipo: 'desconhecida', rotulo: 'Partner—' + m[1].trim() });
    else if (/^Friends forever$/i.test(l)) out.push({ tipo: 'friends' });
    else if (/^Choose a Background$/i.test(l)) out.push({ tipo: 'escolhe' });
    else if (/^Doctor's companion$/i.test(l)) out.push({ tipo: 'companion' });
  }
  return out;
}
const ehAntecedente = c => /\blegendary\b/i.test(c.type_line || '') && /\benchantment\b.*—.*\bbackground\b/i.test(c.type_line || '');
/** 702.124m · Doutor: criatura lendária cujos tipos de criatura são exatamente Time Lord Doctor. */
const ehDoutor = c => /\blegendary\b/i.test(c.type_line || '') && /\bcreature\b/i.test(c.type_line || '') &&
  (String(c.type_line).split('—')[1] || '').trim().split(/\s+/).join(' ').toLowerCase() === 'time lord doctor';
function parceriaDe(a, b) {
  const pa = parceriasDe(a), pb = parceriasDe(b);
  const tem = (ps, t) => ps.some(x => x.tipo === t);
  const nome = c => String(c.name || '').split(' // ')[0].toLowerCase();
  if (tem(pa, 'partner') && tem(pb, 'partner')) return { ok: true, tipo: 'partner' };
  if (pa.some(x => x.tipo === 'with' && x.nome.toLowerCase() === nome(b)) && pb.some(x => x.tipo === 'with' && x.nome.toLowerCase() === nome(a))) return { ok: true, tipo: 'with' };
  if (tem(pa, 'friends') && tem(pb, 'friends')) return { ok: true, tipo: 'friends' };
  if ((tem(pa, 'escolhe') && ehAntecedente(b)) || (tem(pb, 'escolhe') && ehAntecedente(a))) return { ok: true, tipo: 'background' };
  if ((tem(pa, 'companion') && ehDoutor(b)) || (tem(pb, 'companion') && ehDoutor(a))) return { ok: true, tipo: 'doctor' };
  const nova = pa.concat(pb).find(x => x.tipo === 'desconhecida');
  if (nova) return { ok: false, desconhecida: nova.rotulo };
  return { ok: false };
}
function validateDeck(deck, cards, { semRede = false } = {}) {
  const issues = [];
  const add = (level, message) => issues.push({ level, message });
  const get = e => cards.get(norm(e.name));
  const unresolved = deck.entries.filter(e => !get(e));
  // O2 · sem rede, carta sem dados guardados não é "não reconhecida": é "não conferida"
  const lista = `${unresolved.slice(0, 5).map(e => e.name).join(', ')}${unresolved.length > 5 ? '…' : ''}`;
  if (unresolved.length) {
    if (semRede) add('warning', `${unresolved.length} carta(s) ainda não conferida(s) (sem internet; os dados não estão guardados): ${lista}`);
    else add('error', `${unresolved.length} carta(s) não reconhecida(s): ${lista}`);
  }
  const fmt = deck.format;
  if (fmt === 'livre') return issues;

  const playing = deck.entries.filter(e => e.zone === 'main' || e.zone === 'commander'); // L11: companheiro fica fora
  const total = playing.reduce((s, e) => s + e.qty, 0);
  const illegal = deck.entries.filter(e => { const c = get(e); return c && c.legalities && c.legalities[fmt] && c.legalities[fmt] !== 'legal'; });
  if (illegal.length) add('error', `Fora do ${FORMATS[fmt]}: ${illegal.slice(0, 5).map(e => e.name).join(', ')}${illegal.length > 5 ? '…' : ''}`);

  if (fmt === 'commander') {
    const cmd = deck.entries.filter(e => e.zone === 'commander');
    if (!cmd.length) add('error', 'Nenhum comandante definido. Abra a carta e toque em "Definir como comandante".');
    if (cmd.length > 2) add('error', 'Mais de dois comandantes.');
    // M13b · dois comandantes só com uma parceria válida (702.124h–m); um Antecedente só vale ao lado de quem o escolhe
    const par = cmd.length === 2 && cmd.every(get) ? parceriaDe(get(cmd[0]), get(cmd[1])) : null;
    for (const e of cmd) {
      const c = get(e); if (!c) continue;
      const ok = /legendary/i.test(c.type_line) && /creature/i.test(c.type_line) || /can be your commander/i.test(c.oracle_text || '') ||
        (par && par.ok && par.tipo === 'background' && ehAntecedente(c));
      if (!ok) add('error', `${e.name} não pode ser comandante.`);
    }
    if (par && par.desconhecida) add('warning', `A parceria "${par.desconhecida}" não é conferida pelo app: confira se ${cmd[0].name} e ${cmd[1].name} podem ser comandantes juntos.`);
    else if (par && !par.ok) add('error', `${cmd[0].name} e ${cmd[1].name} não podem ser comandantes juntos: os dois precisam de "Partner" (ou "Friends forever"), cada um com "Partner with" o outro, ou um com "Choose a Background" e o outro um Antecedente lendário.`);
    if (total !== 100) add(total < 100 ? 'warning' : 'error', `${total} de 100 cartas (comandante incluído).`);

function createStarterDecks({ decks }) {
  const root = Stack(pad(), Row({}, Spinner()));
  const state = { format: 'all', minhas: [], busy: false, erro: null };
  const FILTROS = [['all', 'Todas'], ['pauper', 'Pauper'], ['commander', 'Commander']];

  // E50 P5 · principal e reserva contados separados
  const contagem = texto => { const es = parseDeckText(texto).entries; const side = es.filter(e => e.zone === 'side').reduce((n, e) => n + e.qty, 0); const main = es.reduce((n, e) => n + e.qty, 0) - side; return side ? `${main} cartas + ${side} na reserva` : `${main} cartas`; };
  const jaTenho = nome => state.minhas.some(d => norm(d.name) === norm(nome));

  async function adicionar(item) {
    if (state.busy || jaTenho(item.name)) return;
    state.busy = true;
    try {
      const { entries } = parseDeckText(item.text);
      await decks.save({ name: item.name, format: item.format, entries });
      state.minhas = await decks.list();
      toast(`${item.name} está na sua estante`);
      paint();

    finally { state.busy = false; }

    if (state.busy) return;

    if (!faltando.length) return toast('Essas listas já estão na sua estante');
    state.busy = true;
    try {
      for (const item of faltando) {
        const { entries } = parseDeckText(item.text);
        await decks.save({ name: item.name, format: item.format, entries });
      }
      state.minhas = await decks.list();
      toast(`${faltando.length} lista(s) adicionada(s)`);
      paint();
    } catch (e) { toast('Não foi possível adicionar: ' + (e.message || e)); }
    finally { state.busy = false; }

  function paint() {
    const visiveis = STARTER_DECKS.filter(x => state.format === 'all' || x.format === state.format);
    const chips = Row({ class: 'ds-row--wrap' }, ...FILTROS.map(([k, label]) => {

      Text('Listas prontas', { size: '2xl', display: true, as: 'h1' }),
      Text('Decks reais para você jogar agora. Um toque põe a lista na sua estante, e de lá você joga, edita ou exporta como qualquer outra.', { tone: 'muted' }),
      chips,
      state.erro ? Note(state.erro, { tone: 'danger' }) : null,
      visiveis.length ? h('div', { class: 'ds-list', id: 'starter-list' }, ...visiveis.map(item => {
        const tenho = jaTenho(item.name);
        return h('div', { class: 'ds-list__item' },

            Text(item.name, { size: 'lg', display: true }),

  /** Reconhece nomes: base de nomes do scanner (offline) primeiro, Scryfall para o resto.

  async function reconhecer(items) {
    const existentes = new Set(state.items.map(g => g.key));
    const conhecidos = new Map(), sugestoes = new Map();
    const faltam = new Map();
    for (const it of items) { const k = norm(it.name); if (!existentes.has(k) && !faltam.has(k)) faltam.set(k, it.name); }
    let base = null;
    try { base = names ? await names.load() : null; } catch (e) { base = null; }
    if (base) {
      for (const [k, nome] of faltam) {
        const best = names.match(nome, { limit: 1 })[0];
        if (best && best.score >= 0.999) { conhecidos.set(k, best.name); faltam.delete(k); }
        else if (best && best.score >= 0.75) sugestoes.set(k, best.name);
      }
    }
    let rede = false;
    if (faltam.size) {
      try {
        const found = await cardRepo.byNames([...faltam.values()]);
        rede = true;
        for (const [k] of faltam) { const c = found.get(k); if (c) { conhecidos.set(k, c.name); faltam.delete(k); } }
      } catch (e) { /* sem rede: o que a base não conhece fica pendente ou entra sem conferir */ }

    }
    ev.push({ kind: 'effect', do: 'counter', name: pk.name, target: s.objects[pk.target] ? s.objects[pk.target].name : '?', failed: true, paid: true });

  },
  decline(s, a, ev) {
    if (!s.pending || s.pending.kind !== 'may_pay' || s.pending.p !== a.p) throw new RuleError('tempo', 'nada a recusar');

  },
  /** S15 · escolhe o alvo de um gatilho. */
  choose_mode(s, a, ev) { // S56 · escolhe o modo do gatilho e segue

  },
  cast_free(s, a, ev) { // S61 · Covil do Mago Louco: conjura uma das compradas sem pagar

  decline_free(s, a, ev) { // S61 · não conjurar nada

  },
  take_loss(s, a, ev) { // S60 · aceita perder a vida em vez de pagar

  },
  pay_unless(s, a, ev) { // S60 · paga o custo para não perder a vida

  },
  sacrifice(s, a, ev) { // S60 · escolhe a permanente que vai para o cemitério

  },
  choose_dungeon(s, a, ev) { // S57 · escolhe em qual masmorra se aventurar

    const pk = s.pending;
    const nome = (pk.options || [])[a.index || 0];
    if (!nome) throw new RuleError('escolha', 'masmorra inválida');
    s.pending = null;

  },
  choose_room(s, a, ev) { // S57 · escolhe para qual sala avançar

  },
  pick_target(s, a, ev) {

  /** S13/S14 · escolhe uma carta da lista revelada. */
  pick(s, a, ev) {

  pick_done(s, a, ev) {

  /** M10/S11b · escolhe a cor que a permanente pediu ao entrar. */
  choose_pair(s, a, ev) { // S51 · escolhe com quem a criatura de vínculo de alma se emparelha

  choose_type(s, a, ev) { // S50 · escolhe o tipo de criatura e segue a mágica

  /** M13 · 903.9: comandante na zona de comando ou onde caiu. */

  /** M10 · escolhe qual gatilho vai para a pilha primeiro (resolve por último). */

  /** S18 · ninjutsu: troca um atacante não bloqueado pelo ninja da mão. */
