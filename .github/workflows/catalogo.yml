# Z1 · Catálogo de listas (ADR-09). Toda semana lê as listas oficiais no MTGJSON e publica JSON pronto no ramo `catalogo`.
# O `main` não recebe commit daqui. O push com o GITHUB_TOKEN não dispara outros fluxos.
# Trilha: geral (arquivo de fluxo novo, no mesmo molde do de Notícias da N1).
name: Catálogo

on:
  schedule:
    - cron: '23 6 * * *'   # todo dia, 06:23 UTC (fora do minuto cheio) — G-241: o Magic Online publica listas diariamente
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5 (fixada por SHA; roda em Node 24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5 (fixada por SHA; roda em Node 24)
        with:
          node-version: 22
      - name: Trazer o que já está publicado (ou começar o ramo vazio)
        run: |
          if git ls-remote --exit-code --heads origin catalogo > /dev/null; then
            git fetch --depth 1 origin catalogo
            git worktree add saida FETCH_HEAD
            git -C saida switch -c catalogo
          else
            git worktree add --detach saida
            git -C saida switch --orphan catalogo
            printf '%s\n' '# Estante · catálogo de listas' '' 'Ramo gerado pelo fluxo "Catálogo" (`catalogo.mjs`, no `main`). Não edite à mão.' '' 'Fonte: MTGJSON (https://mtgjson.com), licença MIT.' > saida/README.md
          fi
      - name: Coletar
        id: coleta
        # Z5 · a chave da TopDeck.gg só existe aqui, como segredo do repositório; sem ela, só as listas oficiais
        env:
          TOPDECK_KEY: ${{ secrets.TOPDECK_KEY }}
        run: node catalogo.mjs --saida saida
      - name: Sentinela de cobertura do Pauper
        # H-15 · I-299 · mede as listas Pauper com o texto da Scryfall, como o app, e grava cobertura/pauper.json no ramo catalogo
        # (a fila de cartas pendentes que a tarefa "Sentinela do Pauper" do Claude lê). Nunca derruba a coleta.
        if: always() && steps.coleta.conclusion != 'skipped'
        continue-on-error: true
        timeout-minutes: 10
        run: node cobertura.mjs --catalogo saida --formato pauper
      - name: Sentinela de cobertura do Commander
        # I-300 · as listas Commander medidas como o app (texto da Scryfall), na ordem gulosa (lista mais perto de 100% primeiro);
        # grava cobertura/commander.json com o texto do dia só nas 300 primeiras cartas da ordem. Nunca derruba a coleta.
        if: always() && steps.coleta.conclusion != 'skipped'
        continue-on-error: true
        timeout-minutes: 15
        run: node cobertura.mjs --catalogo saida --formato commander --textos 300
      - name: Sentinela de cobertura dos demais formatos
        # Q10-7c · relato #32: Modern, Legacy, Standard, Pioneer, Vintage, Brawl, Iniciante e Construído medidos como o app (sem o
        # texto do dia: só a porcentagem de cada lista, em cobertura/motor.json, e o relatório de cada formato). Nunca derruba a coleta.
        if: always() && steps.coleta.conclusion != 'skipped'
        continue-on-error: true
        timeout-minutes: 20
        # I-303 · H-17: nos cinco competitivos de 60 cartas, o texto do dia nas 150 primeiras da ordem gulosa (fila de trabalho do motor)
        run: node cobertura.mjs --catalogo saida --formato todos --exceto pauper,commander --textos 0 --textos-competitivos 150
      - name: Publicar no ramo catalogo
        if: always() && steps.coleta.conclusion != 'skipped'
        run: |
          cd saida
          git add -A
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git -c user.name="estante-catalogo" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Catálogo · coleta de $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin catalogo
