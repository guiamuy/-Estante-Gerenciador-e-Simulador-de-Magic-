# Portão de release. Falhou, não entrega: o GitHub marca o commit com ✗.
name: Portão de release

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # fuzz pesado, todo dia às 3h de Brasília
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 150   # a guarda de agregação precisa enxergar os commits recentes das outras trilhas
      - name: Guarda de agregação (nenhuma trilha apaga a entrega de outra)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node agregacao.mjs --faixa "${{ github.event.before }}..${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Unidade, fuzz, golden, integração e contrato visual
        run: npm test
        env:
          CI: 'true'
          FUZZ_GAMES: ${{ github.event_name == 'schedule' && '3000' || '250' }}
