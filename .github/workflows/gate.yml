# Portão de release. Falhou, não entrega: o GitHub marca o commit com ✗.
name: Portão de release

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # fuzz pesado, todo dia às 3h de Brasília
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 150   # a guarda de agregação precisa enxergar os commits recentes das outras trilhas
      - name: Guarda de agregação (nenhuma trilha apaga a entrega de outra)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node agregacao.mjs --faixa "${{ github.event.before }}..${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Unidade, fuzz, golden, integração e contrato visual
        run: |
          set -o pipefail
          node --test --test-name-pattern 'partida online|Leva 137 chat' e2e.test.mjs 2>&1 | tee portao.log
        env:
          CI: 'true'
          FUZZ_GAMES: ${{ github.event_name == 'schedule' && '3000' || '250' }}
      # Quando o portão cai, o nome de cada teste que falhou e a primeira linha do erro viram anotação do job:
      # dá para ler pela API (gh api .../check-runs/<id>/annotations) sem baixar o log inteiro.
      - name: Testes que falharam
        if: failure()
        run: |
          test -f portao.log || exit 0
          awk '/^not ok/ { nome=$0; pega=1; next } pega && /error:/ { getline l1; getline l2; gsub(/^ +/, "", l1); gsub(/^ +/, "", l2); print "::error title=" substr(nome, 1, 120) "::" nome " — " $0 " " l1 " " l2; pega=0 }' portao.log | head -6
          awk '/^not ok 29[14]/ { pega=1; n=0 } pega && /actual - expected/ { dentro=1; next } dentro { gsub(/^ +/, ""); linha = linha " ¦ " $0; n++; if (n >= 14) { print "::error title=detalhe::" linha; linha=""; dentro=0; pega=0 } }' portao.log | head -3
