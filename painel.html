<title>Painel Estante</title>
<style>/* ==== ds:tokens · espelho de index.html (o teste painel.unit exige igualdade exata) ==== */
/* =====================================================================
   F4 · TOKENS
   Única fonte de cor, espaço, raio, elevação, tipografia e movimento.
   Nenhuma regra de componente pode escrever valor literal.

   Referências: Arena (mesa escura, carta como única cor viva),
   Scryfall (tipografia de dado, densidade sem ruído),
   Moxfield (densidade de lista).
   ===================================================================== */
:root {
  /* ---- espaço: escala de 4px ---- */
  --space-0: 0;
  /* D1 · densidade (Ajustes › Aparência): confortável 1, compacta .85. O alvo de toque (--tap-min) não encolhe. */
  --densidade: 1;
  --space-1: calc(4px * var(--densidade));
  --space-2: calc(8px * var(--densidade));
  --space-3: calc(12px * var(--densidade));
  --space-4: calc(16px * var(--densidade));
  --space-5: calc(24px * var(--densidade));
  --space-6: calc(32px * var(--densidade));
  --space-7: calc(48px * var(--densidade));
  --space-8: calc(64px * var(--densidade));

  /* ---- raio ---- */
  --radius-0: 2px;  /* D1 · sublinhado, trilhos finos */
  --radius-1: 4px;
  --radius-2: 8px;
  --radius-tile: 9px; /* D1 · ladrilho da marca */
  --radius-3: 14px;
  --radius-full: 999px;
  --radius-card: 4.75%;

  /* ---- tipografia ---- */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* D1 · escala de texto (Ajustes › Aparência): pequena .92, média 1, grande 1.12. Multiplica todos os tamanhos. */
  --escala-texto: 1;
  --text-xs: calc(11px * var(--escala-texto));   --lh-xs: 1.45;
  --text-sm: calc(12.5px * var(--escala-texto)); --lh-sm: 1.45;
  --text-md: calc(14px * var(--escala-texto));   --lh-md: 1.5;
  --text-lg: calc(16px * var(--escala-texto));   --lh-lg: 1.45;
  --text-xl: calc(20px * var(--escala-texto));   --lh-xl: 1.3;
  --text-2xl: calc(27px * var(--escala-texto));  --lh-2xl: 1.2;
  --text-3xl: calc(36px * var(--escala-texto));  --lh-3xl: 1.1;
  /* D1 · tamanhos miúdos e de símbolo que antes eram literais nos componentes */
  --text-2xs: calc(10px * var(--escala-texto));  --text-3xs: calc(9px * var(--escala-texto));
  --simbolo-sm: 15px; --simbolo-md: 16px; --simbolo-lg: 18px; --simbolo-xl: 24px;
  --weight-regular: 400;
  --weight-medium: 600;
  --weight-bold: 700;

  /* ---- movimento ---- */
  --dur-1: 110ms;
  --dur-2: 180ms;
  --dur-3: 280ms;
  --dur-4: 420ms;   /* D1 · chegada de carta, troca de vez */
  --dur-giro: 700ms; /* D1 · giro contínuo do carregando */
  --dur-pulso: 1200ms; /* D10 · pulso de atenção (ligação caindo, chip ligado) */
  --dur-fx-curto: 320ms; /* G5 · efeito de mesa curto: tremor de dano, clarão, carta que some */
  --dur-fx: 560ms; /* G5 · efeito de mesa: investida de ataque, pulso de cura e de aprimoramento, abalo */
  --dur-fx-longo: 900ms; /* G5 · número que sobe do marcador de vida */
  --dur-pulso-lento: 2400ms; /* D10 · pulso lento e discreto (sem internet na barra) */
  --dur-brilho: 1200ms; /* D10 · brilho de carregamento que atravessa a moldura */
  --dur-arruma: 1680ms; /* J4 · um ciclo do carregamento: três cartas se arrumam na prateleira */
  --dur-abertura: 2000ms; /* J5 · a abertura inteira: o ladrilho pousa, a estante aparece e as três cartas caem no lugar (I7: de 1,2 s para 2 s) */
  --ease-out: cubic-bezier(.22, .61, .36, 1);
  --ease-in-out: cubic-bezier(.45, .05, .55, .95);
  --ease-mola: cubic-bezier(.34, 1.56, .64, 1); /* T3 · volta com um leve repique (o Jogar soltando) */

  /* ---- camadas ---- */
  --z-base: 0;
  --z-sticky: 20;
  --z-overlay: 40;
  --z-modal: 60;
  --z-toast: 80;

  /* ---- alvo de toque ---- */
  --tap-min: 44px;

  /* ---- cor das manas: constante entre temas, é identidade de Magic ---- */
  /* N2 · bandeiras do seletor de idioma: cores da própria bandeira, as mesmas nos dois temas */
  --bandeira-verde: #1f9a4c; --bandeira-amarelo: #f6cf2f; --bandeira-azul: #23408f; --bandeira-vermelho: #c0343f; --bandeira-branco: #f4f1ea;
  --mana-w: #f5e6c8;
  --mana-u: #4a7fb5;
  --mana-b: #4b4453;
  --mana-r: #c05a3e;
  --mana-g: #3f8558;
  --mana-c: #8a8f99;
  /* U3 · tinta dos glifos sobre o círculo de mana e o aro do símbolo */
  --mana-ink-dark: #231a0e;
  --mana-ink-light: #fbf6ea;
  --mana-ring: rgba(20, 14, 6, .45);

  /* ---- tema escuro: nogueira e papel envelhecido ----
     Madeira é o móvel; a carta é o conteúdo. Nenhum tom de madeira
     aparece em texto ou em estado — só em fundo, superfície e borda. */
  --bg: #14100b;
  --bg-elev-1: #1f1811;
  --bg-elev-2: #2a2118;
  --bg-elev-3: #372c20;
  --border: #443626;
  --border-strong: #5e4b34;
  --fg: #f1e8d7;
  --fg-muted: #bcab90;
  --fg-subtle: #9c8b71;
  --simbolo-filtro: invert(.86) sepia(.2); /* N5 · o símbolo de coleção da Scryfall é preto: no escuro ele clareia */
  --fg-grupo: var(--accent); /* D11 · cabeçalho de grupo em latão no escuro (6,1:1) */
  --accent: #cfa851;
  --accent-hover: #e8c375;
  --accent-fg: #18120a;
  --accent-soft: rgba(207, 168, 81, .16);
  /* U7 · cor do oponente na mesa (a sua é o acento) */
  --player-opp: #86acd8;
  --player-opp-fg: #0b1520;
  --player-opp-soft: rgba(134, 172, 216, .18);
  --positive: #6fae8d;
  --positive-fg: #0c1a13;
  --negative: #d4785f;
  --negative-fg: #1c0e09;
  --warning: #d9a33f;
  --overlay: rgba(10, 7, 4, .82);
  --scrim: rgba(20, 16, 11, .95);
  --grain-1: rgba(255, 244, 222, .022);
  --grain-2: rgba(0, 0, 0, .18);
  --shelf-edge: #4a3a27;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .42);
  --shadow-2: 0 4px 12px rgba(0, 0, 0, .48);
  --shadow-3: 0 12px 34px rgba(0, 0, 0, .6);
  --shadow-up: 0 -10px 28px -14px rgba(0, 0, 0, .6); /* U6b · sombra da folha inferior, para cima */
  /* U2 · profundidade de botão: brilho no topo, lábio embaixo, sombra curta; pressionado afunda */
  --btn-shine: rgba(255, 240, 210, .07);
  --btn-shine-accent: rgba(255, 250, 235, .16);
  --btn-rest: 0 1px 0 rgba(0, 0, 0, .38), 0 3px 6px -3px rgba(0, 0, 0, .55);
  --btn-pressed: inset 0 2px 3px rgba(0, 0, 0, .38);
  /* T3 · relevo do Jogar: placa de latão com lábio, fio de luz no topo e sombra que assenta na madeira */
  --relevo-escuro: rgba(28, 16, 2, .55);
  --relevo-claro: rgba(255, 250, 235, .42);
  --relevo-sombra: 0 16px 24px -14px rgba(0, 0, 0, .78);
  --focus-ring: 0 0 0 3px var(--accent-soft);
  color-scheme: dark;
}

/* ---- tema claro: papel e tinta, não inversão ---- */
:root[data-theme="light"] {
  --bg: #e7dbc4;
  --bg-elev-1: #f6eeda;
  --bg-elev-2: #e0d3b6;
  --bg-elev-3: #d1c09c;
  --border: #bda98a;
  --border-strong: #9a8560;
  --fg: #241b0f;
  --fg-muted: #57492f;
  --fg-subtle: #5f4f36; /* D11 · AA sobre --bg-elev-2 (antes 4,44) */
  --simbolo-filtro: none;
  --fg-grupo: var(--fg-muted); /* D11 · cabeçalho de grupo: no claro o latão não passa de 4,5 sobre a estante */
  --accent: #7a5a17;
  --accent-hover: #674b12;
  --accent-fg: #fdf8ea;
  --accent-soft: rgba(122, 90, 23, .15);
  --player-opp: #2c5a88;
  --player-opp-fg: #f4f8fc;
  --player-opp-soft: rgba(44, 90, 136, .14);
  --positive: #2a6349;
  --positive-fg: #f1f8f4;
  --negative: #92381f;
  --negative-fg: #fdf2ee;
  --warning: #7a580d;   /* leva 123 · era #8a6410 (3,9:1 sobre o fundo); agora AA sobre fundo e superfície */
  --overlay: rgba(46, 35, 18, .5);
  --scrim: rgba(246, 238, 218, .95);
  --grain-1: rgba(90, 62, 22, .035);
  --grain-2: rgba(120, 88, 40, .05);
  --shelf-edge: #b59a6c;
  --shadow-1: 0 1px 2px rgba(74, 56, 26, .14);
  --shadow-2: 0 4px 12px rgba(74, 56, 26, .18);
  --shadow-3: 0 12px 34px rgba(74, 56, 26, .24);
  --shadow-up: 0 -10px 28px -14px rgba(74, 56, 26, .24); /* U6b · sombra da folha inferior, para cima */
  --btn-shine: rgba(255, 252, 244, .5);
  --btn-shine-accent: rgba(255, 244, 214, .14);
  --btn-rest: 0 1px 0 rgba(92, 68, 30, .22), 0 3px 6px -3px rgba(74, 56, 26, .3);
  --btn-pressed: inset 0 2px 3px rgba(74, 56, 26, .22);
  --relevo-escuro: rgba(34, 20, 4, .5);
  --relevo-claro: rgba(255, 248, 228, .34);
  --relevo-sombra: 0 14px 22px -14px rgba(64, 42, 10, .55);
  color-scheme: light;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    --bg: #e7dbc4;
    --bg-elev-1: #f6eeda;
    --bg-elev-2: #e0d3b6;
    --bg-elev-3: #d1c09c;
    --border: #bda98a;
    --border-strong: #9a8560;
    --fg: #241b0f;
    --fg-muted: #57492f;
    --fg-subtle: #5f4f36;
    --simbolo-filtro: none;
    --fg-grupo: var(--fg-muted);
    --accent: #7a5a17;
    --accent-hover: #674b12;
    --accent-fg: #fdf8ea;
    --accent-soft: rgba(122, 90, 23, .15);
    --player-opp: #2c5a88;
    --player-opp-fg: #f4f8fc;
    --player-opp-soft: rgba(44, 90, 136, .14);
    --positive: #2a6349;
    --positive-fg: #f1f8f4;
    --negative: #92381f;
    --negative-fg: #fdf2ee;
    --warning: #7a580d;   /* leva 123 · era #8a6410 (3,9:1 sobre o fundo); agora AA sobre fundo e superfície */
    --overlay: rgba(46, 35, 18, .5);
    --scrim: rgba(246, 238, 218, .95);
    --grain-1: rgba(90, 62, 22, .035);
    --grain-2: rgba(120, 88, 40, .05);
    --shelf-edge: #b59a6c;
    --shadow-1: 0 1px 2px rgba(74, 56, 26, .14);
    --shadow-2: 0 4px 12px rgba(74, 56, 26, .18);
    --shadow-3: 0 12px 34px rgba(74, 56, 26, .24);
    --shadow-up: 0 -10px 28px -14px rgba(74, 56, 26, .24); /* U6b · sombra da folha inferior, para cima */
    --btn-shine: rgba(255, 252, 244, .5);
    --btn-shine-accent: rgba(255, 244, 214, .14);
    --btn-rest: 0 1px 0 rgba(92, 68, 30, .22), 0 3px 6px -3px rgba(74, 56, 26, .3);
    --btn-pressed: inset 0 2px 3px rgba(74, 56, 26, .22);
    --relevo-escuro: rgba(34, 20, 4, .5);
    --relevo-claro: rgba(255, 248, 228, .34);
    --relevo-sombra: 0 14px 22px -14px rgba(64, 42, 10, .55);
    color-scheme: light;
  }
}

/* ---------------- D2 · acento escolhido (Ajustes › Aparência) ----------------
   Latão é o padrão (os tokens acima). Cada acento define o quarteto de acento nos dois temas, com AA sobre o fundo
   e sobre a superfície e com o texto do botão legível sobre ele (conferido no contrato visual). As amostras
   (`--acento-*`) desenham os botões de escolha. */
:root {
  --acento-latao: #cfa851; --acento-cobre: #d9925f; --acento-prata: #c9c9c1; --acento-jade: #7fc9a4;
}
:root[data-theme="light"] {
  --acento-latao: #7a5a17; --acento-cobre: #7f441c; --acento-prata: #555a61; --acento-jade: #1b6547;
}
:root[data-acento="cobre"] { --accent: #d9925f; --accent-hover: #e6a677; --accent-fg: #18120a; --accent-soft: rgba(217, 146, 95, .16); }
:root[data-acento="prata"] { --accent: #c9c9c1; --accent-hover: #dcdcd4; --accent-fg: #18120a; --accent-soft: rgba(201, 201, 193, .16); }
:root[data-acento="jade"] { --accent: #7fc9a4; --accent-hover: #9adcbb; --accent-fg: #18120a; --accent-soft: rgba(127, 201, 164, .16); }
:root[data-theme="light"][data-acento="cobre"] { --accent: #7f441c; --accent-hover: #6b3917; --accent-fg: #fdf8ea; --accent-soft: rgba(127, 68, 28, .15); }
:root[data-theme="light"][data-acento="prata"] { --accent: #555a61; --accent-hover: #474b52; --accent-fg: #fdf8ea; --accent-soft: rgba(85, 90, 97, .15); }
:root[data-theme="light"][data-acento="jade"] { --accent: #1b6547; --accent-hover: #175539; --accent-fg: #fdf8ea; --accent-soft: rgba(27, 101, 71, .15); }
/* D7 · superfície da mesa: só a tela da partida troca o fundo (body[data-tela="partida"]); nogueira é o móvel de sempre */
:root { --mesa-bg: var(--bg); --mesa-veio-1: var(--grain-1); --mesa-veio-2: var(--grain-2); }
/* K2 · feltros do escuro com presença: o verde antigo (#15302a) quase não se separava das zonas (1,24:1 contra
   --bg-elev-1); os novos ficam em 1,6:1 ou mais, com o texto ainda AA (o contrato visual mede --fg e --fg-muted) */
:root[data-superficie="feltro"] { --mesa-bg: #1b4535; --mesa-veio-1: rgba(255, 255, 255, .03); --mesa-veio-2: rgba(0, 0, 0, .16); }
:root[data-superficie="oceano"] { --mesa-bg: #173f57; --mesa-veio-1: rgba(255, 255, 255, .03); --mesa-veio-2: rgba(0, 0, 0, .16); }
:root[data-superficie="vinho"] { --mesa-bg: #632a3b; --mesa-veio-1: rgba(255, 240, 230, .03); --mesa-veio-2: rgba(0, 0, 0, .16); }
:root[data-superficie="pedra"] { --mesa-bg: #22252a; --mesa-veio-1: rgba(255, 255, 255, .02); --mesa-veio-2: rgba(0, 0, 0, .2); }
:root[data-superficie="linho"] { --mesa-bg: #262320; --mesa-veio-1: rgba(255, 244, 222, .03); --mesa-veio-2: rgba(255, 244, 222, .02); }
:root[data-theme="light"][data-superficie="feltro"] { --mesa-bg: #c3d9c6; --mesa-veio-1: rgba(20, 60, 40, .04); --mesa-veio-2: rgba(20, 60, 40, .05); }
:root[data-theme="light"][data-superficie="pedra"] { --mesa-bg: #d7d8d9; --mesa-veio-1: rgba(0, 0, 0, .03); --mesa-veio-2: rgba(0, 0, 0, .05); }
:root[data-theme="light"][data-superficie="linho"] { --mesa-bg: #ebe4d4; --mesa-veio-1: rgba(90, 62, 22, .04); --mesa-veio-2: rgba(90, 62, 22, .04); }
:root[data-theme="light"][data-superficie="oceano"] { --mesa-bg: #c2d6e0; --mesa-veio-1: rgba(20, 50, 70, .04); --mesa-veio-2: rgba(20, 50, 70, .05); }
:root[data-theme="light"][data-superficie="vinho"] { --mesa-bg: #e2c9cd; --mesa-veio-1: rgba(80, 20, 35, .04); --mesa-veio-2: rgba(80, 20, 35, .05); }
body[data-tela="partida"] { --bg: var(--mesa-bg); --grain-1: var(--mesa-veio-1); --grain-2: var(--mesa-veio-2); }
/* D7 · cor do oponente na mesa: azul é a de sempre; rubi e ametista com par de contraste nos dois temas */
:root[data-oponente="rubi"] { --player-opp: #dc8f98; --player-opp-fg: #1c0a0d; --player-opp-soft: rgba(220, 143, 152, .18); }
:root[data-oponente="ametista"] { --player-opp: #bb9ddc; --player-opp-fg: #150b1f; --player-opp-soft: rgba(187, 157, 220, .18); }
:root[data-theme="light"][data-oponente="rubi"] { --player-opp: #8a2b3a; --player-opp-fg: #fdf8ea; --player-opp-soft: rgba(138, 43, 58, .14); }
:root[data-theme="light"][data-oponente="ametista"] { --player-opp: #5b3c8a; --player-opp-fg: #fdf8ea; --player-opp-soft: rgba(91, 60, 138, .14); }
/* amostras para os chips da Aparência */
:root { --superficie-nogueira: #1f1811; --superficie-feltro: #1b4535; --superficie-oceano: #173f57; --superficie-vinho: #632a3b; --superficie-pedra: #22252a; --superficie-linho: #262320; --oponente-azul: #86acd8; --oponente-rubi: #dc8f98; --oponente-ametista: #bb9ddc; }
:root[data-theme="light"] { --superficie-nogueira: #e7dbc4; --superficie-feltro: #c3d9c6; --superficie-oceano: #c2d6e0; --superficie-vinho: #e2c9cd; --superficie-pedra: #d7d8d9; --superficie-linho: #ebe4d4; --oponente-azul: #2c5a88; --oponente-rubi: #8a2b3a; --oponente-ametista: #5b3c8a; }
/* D2 · menos movimento por escolha (além do que o sistema pede): tudo instantâneo */
:root[data-movimento="reduzido"] *, :root[data-movimento="reduzido"] *::before, :root[data-movimento="reduzido"] *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

/* =====================================================================
   
/* ==== ds:componentes · espelho de index.html (cada bloco existe, idêntico, no index.html) ==== */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
html { -webkit-tap-highlight-color: transparent; }
:focus:not(:focus-visible) { outline: none; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: var(--text-md);
  line-height: var(--lh-md);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.ds-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.ds-row { display: flex; align-items: center; gap: var(--space-2); }
.ds-row--wrap { flex-wrap: wrap; }
.ds-grow { flex: 1; min-width: 0; }
.ds-center { display: grid; place-items: center; }
.ds-wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 var(--space-4); }
.ds-surface { background: var(--bg-elev-1); border-radius: var(--radius-2); box-shadow: var(--shadow-1); }
.ds-surface--flat { box-shadow: none; border: 1px solid var(--border); }
.ds-surface--raised { background: var(--bg-elev-2); box-shadow: var(--shadow-2); }
.ds-surface--pad { padding: var(--space-4); }
